name: PXL Classroom Install
description: >-
  Set up Node and install the hub's dependencies (npm ci --omit=dev), trying a
  network or registry failure again and failing anything else at once
  (npm-ci-retry.mjs). One step for every job whose install must survive a blip
  at the npm registry.

inputs:
  deadline-at:
    description: >-
      The instant the job acts at, or empty. No wait crosses it, and trying
      ends an hour after it.
    required: false
    default: ""
  retry-budget-minutes:
    description: How long the install may keep trying. Keep it under the job's own timeout.
    required: false
    default: "8"

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"

    - name: npm ci, retried on a network failure
      shell: bash
      working-directory: ${{ github.action_path }}/..
      env:
        DEADLINE_AT: ${{ inputs.deadline-at }}
        RETRY_BUDGET_MINUTES: ${{ inputs.retry-budget-minutes }}
      run: node "$GITHUB_ACTION_PATH/npm-ci-retry.mjs"
