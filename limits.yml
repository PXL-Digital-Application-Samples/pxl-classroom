# PXL Classroom - global weekly usage limits per SKU.
#
# Resolution order: per-repo override > per-org override > this file's default.
# - per-repo: <org>/pxl-classroom-control/limits-overrides.json
# - per-org:  participating-orgs.yml -> orgs[i].overrides
# - global:   this file
#
# Schema: schemas/limits.schema.json
# SKUs come from GitHub's Enhanced Billing API; the catalog is open-ended.
# Add entries here as new SKUs appear in the weekly usage reports.
#
# A GigabyteHours limit is GB x hours, and a week is 168 hours: 168 is one GB
# held all week. Team includes 2 GB of artifact and package storage, so Actions
# and Packages storage warn at half of it.
#
# Minutes on standard runners in a PUBLIC repository cost nothing and are never
# measured against these (scripts/usage-fetch.mjs). The hub is one.

schema_version: 1
weekly_limits:
  - sku: "Actions Linux"
    unit: Minutes
    limit: 800
  - sku: "Actions Windows"
    unit: Minutes
    limit: 200
  - sku: "Actions macOS"
    unit: Minutes
    limit: 100
  - sku: "Actions storage"
    unit: GigabyteHours
    limit: 168
  - sku: "Packages storage"
    unit: GigabyteHours
    limit: 168
  - sku: "Packages data transfer"
    unit: Gigabytes
    limit: 5
  - sku: "Git LFS storage"
    unit: GigabyteHours
    limit: 336
  - sku: "Git LFS bandwidth"
    unit: Gigabytes
    limit: 2
  - sku: "Codespaces compute"
    unit: Hours
    limit: 10
  - sku: "Codespaces storage"
    unit: GigabyteHours
    limit: 840
