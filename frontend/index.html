<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PXL Classroom - GitHub-native assignment distribution and submission reporting" />
    <!-- Covers the browser's very first canvas fill, before style.css lands.
         Dark first because dark is the default theme. -->
    <meta name="color-scheme" content="dark light" />
    <title>PXL Classroom</title>
    <!-- Inter, loaded non-blocking: the print-media trick defers the CSS off
         the critical path; style.css's system-ui fallback covers the gap. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <script>
      // SPA shim decoder - pairs with public/404.html.
      // Adapted from rafgraph/spa-github-pages (MIT).
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
    <script>
      // Theme boot. Runs before first paint so a light-mode user never flashes
      // dark, and after the SPA shim above so a deep link redirected through
      // 404.html has its ?theme= back in place before we read it.
      //
      // Duplicates the storage key and mode list from src/lib/theme.js on
      // purpose - this has to run before the module graph loads.
      // tests/theme-tokens.test.mjs asserts the two stay in sync.
      (function () {
        var VALID = ['dark', 'light', 'system'];
        var html = document.documentElement;
        try {
          var requested = new URLSearchParams(window.location.search).get('theme');
          var override = VALID.indexOf(requested) !== -1 ? requested : null;
          var stored = localStorage.getItem('pxl_theme');
          if (override) localStorage.setItem('pxl_theme', override);
          html.dataset.theme = override || (VALID.indexOf(stored) !== -1 ? stored : 'dark');
        } catch (e) {
          // Storage blocked or URL unparseable - the CSS default is dark anyway.
          html.dataset.theme = 'dark';
        }
      }());
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
