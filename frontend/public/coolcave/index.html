<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COOLCAVE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrapper">
    <div id="top-bar">
      <span id="game-title">COOLCAVE</span>
      <span id="level-text">LVL: 1</span>
      <span id="score-text">SCORE: 0</span>
      <span id="best-text">BEST: 0</span>
      <button id="theme-btn" title="TOGGLE THEME">THEME</button>
    </div>
    <canvas id="cave-canvas" width="320" height="240"></canvas>
    <div id="bottom-bar">HOLD [SPACE] / CLICK TO FLY UP &bull; RELEASE TO DRIFT DOWN</div>
  </div>
  <script src="game.js"></script>
</body>
</html>
