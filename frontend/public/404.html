<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PXL Classroom</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
  // SPA shim for GitHub Pages.
  // Encodes the path into a single query string, then redirects to the
  // SPA's index.html where a matching decoder rebuilds the route.
  // Adapted from rafgraph/spa-github-pages (MIT).
  //
  // GitHub Pages serves THIS file for every missing path on the site, the beta
  // channel's included, so it has to know where the beta app lives: kept at one
  // segment, a deep link into /pxl-classroom/beta/... was rewritten onto the
  // production app. deploy-frontend.yml always publishes a beta/index.html (the
  // app, or a page saying none is published), so this never redirects to a
  // path that 404s back here.
  var l = window.location;
  var pathSegmentsToKeep = l.pathname.split('/')[2] === 'beta' ? 2 : 1; // /pxl-classroom/[beta/]
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body></body>
</html>
