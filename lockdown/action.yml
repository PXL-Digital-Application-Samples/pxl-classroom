name: PXL Classroom Lockdown
description: >-
  At the deadline, stop writes to every student repo's submission ref, then
  record the final snapshot, pushed_at and lockdown time for the whole cohort.
  Stop first, record after: the snapshot is a consistent cut and nobody at the
  end of the list gets extra time. A student with a running deadline extension
  is skipped entirely and recorded with deferred_until, so the assignment
  finalizes them once it expires.

inputs:
  client-id:
    description: GitHub App Client ID
    required: true
  app-private-key:
    description: GitHub App private key (PEM)
    required: true
  org:
    description: Target organization (App must be installed here)
    required: true
  assignment-id:
    description: Assignment slug (matches assignments/<id>.yml)
    required: true
  data-dir:
    description: Root data directory containing assignments/, repositories/, observations/
    required: true
  stop-only:
    description: >-
      Run Phase 1 only - stop writes and exit, writing no lockdown record. What
      the deadline sentinel runs at the instant itself; the ordinary finalize
      follows and does the recording, preservation and reporting.
    required: false
    default: "false"

outputs:
  locked_count:
    description: Number of repos successfully locked down
    value: ${{ steps.run.outputs.locked_count }}
  error_count:
    description: Number of repos that failed
    value: ${{ steps.run.outputs.error_count }}
  deferred_count:
    description: >-
      Number of repos left untouched because a granted deadline extension is
      still running. Neither locked nor failed.
    value: ${{ steps.run.outputs.deferred_count }}
  lock_method:
    description: How writes were stopped - ruleset | demotion | none
    value: ${{ steps.run.outputs.lock_method }}
  no_submission_count:
    description: >-
      Students with nothing committed before their deadline under
      late_policy block. An outcome, not an error.
    value: ${{ steps.run.outputs.no_submission_count }}
  uncertainty_seconds:
    description: Maximum uncertainty interval (lockdown_at - deadline_at) across all repos
    value: ${{ steps.run.outputs.uncertainty_seconds }}
  outcome:
    description: locked | partial | fail:*
    value: ${{ steps.run.outputs.outcome }}

runs:
  using: composite
  steps:
    - name: Mint App installation token for the target org
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.org }}

    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "24"

    - name: Install shared dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: npm ci --omit=dev

    - name: Lockdown
      id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        ORG: ${{ inputs.org }}
        ASSIGNMENT_ID: ${{ inputs.assignment-id }}
        DATA_DIR: ${{ inputs.data-dir }}
        STOP_ONLY: ${{ inputs.stop-only == 'true' && '1' || '0' }}
      run: node "$GITHUB_ACTION_PATH/lockdown.mjs"
