name: PXL Classroom Provision
description: >-
  Create a private organization repository from a private template and grant a
  student a role (idempotent), authenticated as a per-organization GitHub App.

inputs:
  client-id:
    description: GitHub App Client ID
    required: true
  app-private-key:
    description: GitHub App private key (PEM)
    required: true
  org:
    description: Target organization (App must be installed here)
    required: true
  assignment-id:
    description: Assignment ID
    required: true
  template-owner:
    description: Template repository owner
    required: true
  template-repo:
    description: Template repository name (must be a template)
    required: true
  template-repository-id:
    description: >-
      Pinned template repository id. Empty when the assignment has no pin -
      which every assignment written before pinning existed does not, so an
      absent value must mean "not pinned", never an id of 0.
    required: false
    default: ""
  target-repo:
    description: Repository name to create
    required: true
  student-login:
    description: Student GitHub login to grant access
    required: true
  student-permission:
    description: pull | triage | push | maintain | admin
    required: false
    default: admin
  repo-private:
    description: Create the repository private
    required: false
    default: "true"
  feedback-pr:
    description: "If 'true', create a frozen baseline branch and protect it for later Feedback PR use."
    required: false
    default: "false"
  feedback-pr-baseline-branch:
    description: Baseline branch name (used as the PR base).
    required: false
    default: "pxl-baseline"
  dry-run:
    description: >-
      "1" to rehearse: the template is read and the collision check runs, but no
      repository is created, no collaborator granted, no record written and no
      Feedback PR opened. The outcome is `dry-run:ok`.

      THIS IS NOT A DRY RUN OF AN ACCEPTANCE. The acceptance action upstream has
      already written the student's acceptance record and spent a slot of
      max_acceptances by the time this runs, and it has no dry-run of its own.
      A workflow that offers one must say which half it rehearses.

      provision.mjs has supported this since it was written and the action could
      not pass it, so the only way to reach it was to run the script by hand.
    required: false
    default: "0"
  previous-repo:
    description: Previous repository to remove collaborator from if switching teams
    required: false
    default: ""
  remove-previous-repo:
    description: >-
      "true" to delete the previous repository - its team was left empty and
      removed. Deleted only if it still holds nothing anybody pushed.
    required: false
    default: "false"
  previous-repo-id:
    description: >-
      The repo_id a record holds for previous-repo. Where given, a repository
      with another id at that name is never deleted.
    required: false
    default: ""
  previous-team-slug:
    description: >-
      The team previous-repo was left with. Its repository is not deleted when
      that team's file exists on the control repository again.
    required: false
    default: ""
  recreate-empty:
    description: >-
      "true" lets provisioning remove an existing repository that has no commit
      and create it again from the template - the leftover of this student's
      own failed attempt. Anything else keeps an existing repository as it is,
      empty or not: a student may have created it themselves.
    required: false
    default: "false"
  template-full-history:
    description: >-
      "true" creates the repository empty and pushes the template into it with
      every branch and its whole history (the assignment's
      template_full_history). Anything else is GitHub's template copy: one
      commit, the default branch only.
    required: false
    default: "false"

outputs:
  repo-id:
    description: Immutable GitHub repository ID
    value: ${{ steps.run.outputs.repo_id }}
  repo-url:
    description: Repository HTML URL
    value: ${{ steps.run.outputs.repo_url }}
  repo-name:
    description: Full name (org/repo)
    value: ${{ steps.run.outputs.repo_name }}
  outcome:
    description: created | reused | dry-run:ok | fail:*
    value: ${{ steps.run.outputs.outcome }}
  invited:
    description: >-
      true when the collaborator grant returned 201, i.e. GitHub sent the
      student an invitation they must accept before the repository is visible
      to them. This is the only place that knows: the student's own browser
      cannot see their pending invitations.
    value: ${{ steps.run.outputs.invited }}
  baseline-sha:
    description: SHA the baseline branch was pinned to (empty if feedback-pr not enabled).
    value: ${{ steps.run.outputs.baseline_sha }}
  starter-sha:
    description: >-
      The commit the repository stood at when provisioning finished with it,
      where provisioning established one: a copy of the template's full
      history (after its own writes), or GitHub's copy that it committed the
      grading workflow to. Empty for GitHub's copy it added nothing to, for a
      reuse it could not recover one on, and when it could not be read.
    value: ${{ steps.run.outputs.starter_sha }}
  starter-commit-count:
    description: >-
      How many commits starter-sha has behind it, counted as the collector
      counts a branch. Empty whenever starter-sha is, or when unread.
    value: ${{ steps.run.outputs.starter_commit_count }}
  full-history:
    description: >-
      "true" when starter-sha is a copy of the template's full history (this
      run made it, or recovered one an earlier run made), else "false".
    value: ${{ steps.run.outputs.full_history }}
  granted:
    description: >-
      "true" once the student was granted access to the repository - set before
      any later step can fail, so a run that failed after the grant still says
      the student holds a repository, and its record is written.
    value: ${{ steps.run.outputs.granted }}

runs:
  using: composite
  steps:
    - name: Mint App installation token for the target org
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.org }}
        # Every repository, because the student repository does not exist yet.
        # The calls behind each permission are in lib/app-token-scopes.mjs.
        permission-administration: write
        permission-contents: write
        permission-metadata: read
        permission-workflows: write
        # The run log warns "Unexpected input(s) 'permission-actions-variables'";
        # it is applied (the same input publish and finalize ask for).
        permission-actions-variables: write

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"

    - name: Install shared dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: npm ci --omit=dev

    - name: Provision
      id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        ORG: ${{ inputs.org }}
        ASSIGNMENT_ID: ${{ inputs.assignment-id }}
        TEMPLATE_OWNER: ${{ inputs.template-owner }}
        TEMPLATE_REPO: ${{ inputs.template-repo }}
        TEMPLATE_REPOSITORY_ID: ${{ inputs.template-repository-id }}
        TARGET_REPO: ${{ inputs.target-repo }}
        STUDENT_LOGIN: ${{ inputs.student-login }}
        STUDENT_PERMISSION: ${{ inputs.student-permission }}
        PRIVATE: ${{ inputs.repo-private }}
        DRY_RUN: ${{ inputs.dry-run }}
        FEEDBACK_PR: ${{ inputs.feedback-pr }}
        FEEDBACK_PR_BASELINE_BRANCH: ${{ inputs.feedback-pr-baseline-branch }}
        PREVIOUS_REPO: ${{ inputs.previous-repo }}
        REMOVE_PREVIOUS_REPO: ${{ inputs.remove-previous-repo }}
        PREVIOUS_REPO_ID: ${{ inputs.previous-repo-id }}
        PREVIOUS_TEAM_SLUG: ${{ inputs.previous-team-slug }}
        RECREATE_EMPTY: ${{ inputs.recreate-empty }}
        TEMPLATE_FULL_HISTORY: ${{ inputs.template-full-history }}
      run: node "$GITHUB_ACTION_PATH/provision.mjs"
