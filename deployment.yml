# PXL Classroom - deployment configuration.
#
# ============================================================================
#  EVERYTHING IN THIS FILE IS SPECIFIC TO ONE INSTITUTION'S INSTALLATION.
#  Forking this software? This is the file you edit - and apart from secrets,
#  it should be the only one.
# ============================================================================
#
# The product name stays "PXL Classroom". That is the software; this file is
# the deployment.
#
# CHANGING A VALUE HERE NEEDS A DEPLOY. The SPA bakes these in at build time,
# so an edit reaches students only once deploy-frontend.yml has run - its path
# filter names this file for exactly that reason.

# Email domains a student may claim an address in, when an assignment does not
# name its own `claim_domains`.
#
# BOTH entries are deliberate. The student domain is the cohort; the staff
# domain is what lets a lecturer accept their own assignment to check a link
# works before handing it to forty people - drop it and self-testing becomes
# impossible on every domain-restricted assignment.
#
# An assignment may narrow this with its own `claim_domains`, or opt out
# entirely with an empty list.
claim_domains:
  - student.pxl.be
  - pxl.be

# The institution's name, as a student or lecturer reads it.
#
# TWO forms, because the sentences need both. The long one names the
# institution ("GitHub has not verified a Hogeschool PXL email address on this
# account"); the short one qualifies a noun without becoming a mouthful ("Your
# PXL email address"). Writing one and trimming it in code guesses wrong the
# moment a fork's name does not split that way.
#
# NOT DERIVABLE FROM `claim_domains`, which is why these are their own keys:
# `pxl.be` gives you "PXL" at best and never "Hogeschool PXL", and a fork whose
# domain is `ugent.be` is not called "UGENT". The domains stay the authority for
# MATCHING an address; these are only ever the authority for NAMING the place.
#
# Distinct from the product name, which stays "PXL Classroom" - see the header.
# A fork changes these two and the software still calls itself PXL Classroom.
institution_name: Hogeschool PXL
institution_short: PXL

# The timezone assignment dates are DISPLAYED in when an assignment carries no
# timezone of its own.
#
# Display only: every stored instant is UTC with an explicit `Z`, and nothing in
# the finalize path reads this. It decides what a lecturer and a student see on
# screen, which for a deadline is worth getting right.
timezone: Europe/Brussels

# The GitHub account and repository holding the hub. Every workflow lives there;
# each course organization holds only data.
hub_owner: PXL-Digital-Application-Samples
hub_repo: pxl-classroom

# The device-flow CORS proxy the SPA tries FIRST.
#
# github.com/login/device/code and /login/oauth/access_token send no CORS
# headers, so a browser cannot call them directly and a proxy is structural
# (ARCHITECTURE §10.2). Whatever sits here SEES THE OAUTH ACCESS TOKEN of every
# lecturer and every student in transit - a lecturer token reads the private
# control repo, which holds the roster: names, student numbers, institutional
# email addresses.
#
# So this is the PXL-owned Cloudflare Worker in cors-worker/, and it is FIRST.
# It used to be second. Measured live 2026-08-31 by loading the deployed SPA and
# reading its own resource timing: the device-code call and all three token
# polls went to corsproxy.io, and the Worker was never contacted once - because
# the third party is only skipped when it FAILS, and it had started working
# again on a paid key. A fallback that never runs protects nobody.
#
# It lives here rather than in a secret because it is not one: it is baked into
# a public bundle at build time and visible to anyone who opens the page. Naming
# it a secret bought nothing and hid the ordering. `VITE_CORS_PROXY_URL` remains
# as the SECOND entry, so a Worker outage still fails over to a third party
# rather than taking sign-in down - the ordering is what changed, not the
# resilience.
#
# Must end at the parameter that receives the target: `?url=`, `&url=` or a bare
# `?`. An unusable value here is SKIPPED, not fatal.
device_flow_proxy: https://pxl-cors.tom-cool-38e.workers.dev/?url=

# The GitHub App slug, as it appears in github.com/apps/<slug>.
#
# A fork creates its own App through the SPA's /setup route and puts the slug
# here. It must be the slug rather than a display name, because it is used to
# read the App's declared permissions.
app_slug: pxl-classroom-provisioner

# The provisioning App's CLIENT ID - the `Iv23...` value, not the numeric App id.
#
# NOT A SECRET: it is what the device flow sends to mint a code, so it is baked
# into the public bundle and visible to anyone who opens the page. It is here
# because it was written out twice - in lib/audit.mjs and in
# frontend/src/lib/config.js - and two copies of "which App is this deployment"
# is one copy too many. An installation record carries `client_id` but not
# always a usable `app_slug`, which is why the audit needs it at all.
app_client_id: Iv23li0H0Je93H2FkMPW

# The per-organization repository holding a course's data: roster, assignments,
# acceptances, observations, reports. Always PRIVATE.
#
# Renaming this on a running deployment orphans every control repository already
# created, so it is effectively fixed once any organization has been onboarded.
control_repo: pxl-classroom-control

# Preserved submissions live in `<archive_repo_prefix><assignment-id>` - one
# archive per assignment, so retiring a finished cohort is a single repository
# rather than one shared with every other year.
archive_repo_prefix: pxl-classroom-archive-

# The single per-organization archive used before archives became per-assignment.
#
# READ, never derived: a submission preserved before that change still lives
# there and must keep resolving. A fork with no history may set this to null.
legacy_archive_repo: pxl-classroom-archive
