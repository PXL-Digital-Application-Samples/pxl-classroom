name: Setup Organization

on:
  workflow_dispatch:
    inputs:
      target_org:
        description: 'Target Organization (e.g., PXLAutomation)'
        required: true
        type: string
      budget_owner_login:
        description: 'GitHub login of the budget owner (receives weekly usage warnings via @-mention)'
        required: true
        type: string

permissions:
  contents: write
  actions: write

# Serialize runs: concurrent onboardings race on the participating-orgs
# branch push (non-fast-forward rejection for the loser).
concurrency:
  group: setup-org-registry
  cancel-in-progress: false

jobs:
  setup-control-repo:
    environment: provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A lecturer dispatches these as themselves, through the SPA or the
      # Actions tab. The only other thing that can reach workflow_dispatch here
      # is an App installation token - which is what a stolen broker credential
      # would be - and it arrives as `<app-slug>[bot]`. Deny that identity
      # rather than maintaining an allowlist of people.
      #
      # It does NOT stop a stolen user credential, which acts as its owner. That
      # is the residual, and rulesets plus the provisioning environment are what
      # bound it.
      - name: Reject automated dispatch
        if: github.event_name == 'workflow_dispatch' && endsWith(github.actor, '[bot]')
        env:
          ACTOR: ${{ github.actor }}
        run: |
          echo "::error::$ACTOR may not dispatch this workflow; a lecturer must run it"
          exit 1

      - name: Checkout main codebase
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify App can access organization billing
        id: billing_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ inputs.target_org }}
          permission-organization-administration: read
        # A 422 "The permissions requested are not granted to this installation"
        # means the App itself, or this org's installation, lacks
        # organization_administration: read. Don't let the action's stack trace
        # be the whole failure - fall through to the probe step, which prints
        # the two-step remediation.
        continue-on-error: true

      - name: Probe Enhanced Billing Usage API
        env:
          GH_TOKEN: ${{ steps.billing_token.outputs.token }}
          TARGET_ORG: ${{ inputs.target_org }}
          APP_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::Cannot mint a token with 'Organization Administration: read' for ${TARGET_ORG}. Fix in this order, then re-run. (1) App owner: https://github.com/organizations/${APP_OWNER}/settings/apps/pxl-classroom-provisioner/permissions -> Organization permissions -> Administration: Read-only -> Save changes. Verify with 'gh api apps/pxl-classroom-provisioner --jq .permissions'. (2) ${TARGET_ORG} owner: https://github.com/organizations/${TARGET_ORG}/settings/installations -> pxl-classroom-provisioner -> Review request -> approve, and set Repository access to 'All repositories'. See RUNBOOK.md section 10.6."
            exit 1
          fi
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          if ! gh api "/organizations/${TARGET_ORG}/settings/billing/usage?year=${YEAR}&month=${MONTH}" >/dev/null; then
            echo "::error::The App holds 'Organization Administration: read' for ${TARGET_ORG} but the Enhanced Billing usage endpoint is still inaccessible - most likely Enhanced Billing is unavailable on this org's plan. See RUNBOOK.md section 10.6."
            exit 1
          fi

      - name: Generate App token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ inputs.target_org }}

      - name: Create pxl-classroom-control repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            const org = context.payload.inputs.target_org;
            const repoName = 'pxl-classroom-control';
            
            console.log(`Checking if ${org}/${repoName} already exists...`);
            try {
              await github.rest.repos.get({ owner: org, repo: repoName });
              console.log('Repository already exists. Proceeding to update files.');
            } catch (error) {
              if (error.status === 404) {
                console.log(`Creating repository ${org}/${repoName}...`);
                await github.rest.repos.createInOrg({
                  org: org,
                  name: repoName,
                  private: true,
                  auto_init: false,
                  description: 'PXL Classroom Control Repository'
                });
                await new Promise(r => setTimeout(r, 5000));
              } else {
                throw error;
              }
            }

            console.log('Setting Actions access to allow reusable workflows from other org repos...');
            try {
              await github.request('PUT /repos/{owner}/{repo}/actions/permissions/access', {
                owner: org,
                repo: repoName,
                access_level: 'organization'
              });
            } catch (error) {
              console.log('Failed to set Actions access level:', error.message);
            }

      # The App installation token and a workflow_dispatch input used to be
      # substituted into the same script TEXT, one character apart. `target_org`
      # is validated in the NEXT step, which is too late to matter: a value that
      # broke out of the URL would have had the token, in scope, in the same
      # shell. Both now arrive through env:, and the login is checked here,
      # before it is used (ARCHITECTURE 4.3.1).
      #
      # The token also stops appearing in the remote URL. `git remote add` with
      # credentials embedded puts them in .git/config and in every error message
      # git prints; http.extraheader keeps it in the environment instead.
      - name: Initialize control repo structure
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          TARGET_ORG: ${{ inputs.target_org }}
        run: |
          printf '%s' "$TARGET_ORG" | grep -Eq '^[A-Za-z0-9](-?[A-Za-z0-9]){0,38}$' \
            || { echo "::error::target_org is not a valid GitHub login."; exit 1; }

          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          git init
          git config user.name "pxl-classroom-provisioner[bot]"
          git config user.email "pxl-classroom-provisioner[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "$AUTH_HEADER"

          git branch -M main
          git remote add origin "https://github.com/${TARGET_ORG}/pxl-classroom-control.git"

          # Pull first, then scaffold: the script only creates what is absent,
          # so this backfills existing control repos without clobbering data.
          git pull --rebase origin main || true

          node "$GITHUB_WORKSPACE/scripts/scaffold-control-repo.mjs" .

          git add .
          git diff --cached --quiet || git commit -m "Initialize control repo structure"

          # Wave 2 architecture: control repos are data-only. If a legacy
          # control repo had workflows pushed before the centralization, strip
          # them now. (See PXLAutomation/pxl-classroom-control cleanup,
          # 2026-06-17, for the reference incident.)
          if [ -d .github/workflows ] || [ -d workflows ]; then
            rm -rf .github/workflows workflows
            git add -A
            git diff --cached --quiet || git commit -m "Remove workflows (control repo is data-only per Wave 2)"
          fi

          git push -u origin main

      - name: Register org in participating-orgs branch
        env:
          TARGET_ORG: ${{ inputs.target_org }}
          BUDGET_OWNER_LOGIN: ${{ inputs.budget_owner_login }}
        run: |
          for v in "$TARGET_ORG" "$BUDGET_OWNER_LOGIN"; do
            if ! printf '%s' "$v" | grep -Eq '^[A-Za-z0-9](-?[A-Za-z0-9]){0,38}$'; then
              echo "::error::'$v' is not a valid GitHub login."
              exit 1
            fi
          done

          git fetch origin participating-orgs:participating-orgs || true
          git checkout participating-orgs || git checkout --orphan participating-orgs

          # Normalise any pre-existing UTF-16 / BOM file to plain UTF-8 LF.
          if [ -f participating-orgs.yml ]; then
            head -c 3 participating-orgs.yml | od -An -tx1 | tr -d ' \n' > .porgs-magic
            MAGIC=$(cat .porgs-magic); rm -f .porgs-magic
            case "$MAGIC" in
              fffe*) iconv -f UTF-16LE -t UTF-8 participating-orgs.yml > participating-orgs.yml.new && mv participating-orgs.yml.new participating-orgs.yml ;;
              feff*) iconv -f UTF-16BE -t UTF-8 participating-orgs.yml > participating-orgs.yml.new && mv participating-orgs.yml.new participating-orgs.yml ;;
              efbbbf) tail -c +4 participating-orgs.yml > participating-orgs.yml.new && mv participating-orgs.yml.new participating-orgs.yml ;;
            esac
            # Strip CRs that may remain from a Windows source.
            tr -d '\r' < participating-orgs.yml > participating-orgs.yml.new && mv participating-orgs.yml.new participating-orgs.yml
          fi

          if [ ! -f participating-orgs.yml ]; then
            printf 'schema_version: 1\norgs:\n' > participating-orgs.yml
          elif ! grep -q '^schema_version:' participating-orgs.yml; then
            { printf 'schema_version: 1\n'; cat participating-orgs.yml; } > participating-orgs.yml.new
            mv participating-orgs.yml.new participating-orgs.yml
          fi

          # A flow-style empty list ('orgs: []') cannot take appended block
          # entries - normalize it to block form first.
          sed -i 's/^orgs:[[:space:]]*\[\][[:space:]]*$/orgs:/' participating-orgs.yml

          if ! grep -Eq "^[[:space:]]*-[[:space:]]+login:[[:space:]]+${TARGET_ORG}[[:space:]]*$" participating-orgs.yml; then
            printf '  - login: %s\n    budget_owner_login: %s\n' "$TARGET_ORG" "$BUDGET_OWNER_LOGIN" >> participating-orgs.yml
            git config user.name "pxl-classroom-provisioner[bot]"
            git config user.email "pxl-classroom-provisioner[bot]@users.noreply.github.com"
            git add participating-orgs.yml
            git commit -m "Register ${TARGET_ORG} in participating-orgs"
            git push origin participating-orgs
          else
            echo "${TARGET_ORG} is already registered."
          fi

      - name: Trigger initial frontend deployment
        run: |
          gh workflow run deploy-frontend.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
