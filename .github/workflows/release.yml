name: Release

# Manual, deliberately.
#
# semantic-release's usual home is a push trigger, and on this repository that
# would be wrong: every push to `main` deploys, and a day of ordinary work
# carries ten or more `fix:` and `feat:` commits. Releasing on each one turns
# the release list into the commit log with extra steps, and a release that
# means nothing is not worth the tag.
#
# So the NUMBER is computed automatically - from the conventional commits that
# are already written - and the DECISION to cut a release stays a human one.
# Run it from the Actions tab when a batch of work is worth naming.
#
# What it does: reads commits since the last tag, works out patch/minor/major,
# creates the tag and a GitHub Release with generated notes. It writes nothing
# back to the branch (see .releaserc.json for why), so it cannot race the deploy
# it triggers.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report the version that WOULD be released, and change nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Tags and releases.
      contents: write
      issues: write
      pull-requests: write
      actions: write # dispatches deploy-frontend.yml once the tag exists
    steps:
      # A release is a statement about what a human decided to ship. Nothing
      # here reads a hub App credential, but the guard is the same one every
      # other dispatchable workflow carries: a bot may not cut a release.
      - name: Refuse a bot actor
        if: endsWith(github.actor, '[bot]')
        run: |
          echo "Releases are cut by people, not by ${GITHUB_ACTOR}." >&2
          exit 1
        env:
          GITHUB_ACTOR: ${{ github.actor }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release reads the whole history to find the last tag and
          # everything after it. A shallow clone makes it believe the project
          # has no releases and start again at 1.0.0.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -e -o pipefail
          # Pinned exactly, like every other tool this repository fetches.
          # `npx semantic-release` unpinned would mean a release process that
          # changes under you between runs.
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="--dry-run"; fi
          npx --yes \
            --package semantic-release@24.2.9 \
            --package @semantic-release/commit-analyzer@13.0.1 \
            --package @semantic-release/release-notes-generator@14.0.3 \
            --package @semantic-release/github@11.0.6 \
            --package conventional-changelog-conventionalcommits@8.0.0 \
            -- semantic-release $ARGS 2>&1 | tee release.log

          # THE DRY RUN SAYS "Published release" TOO. Measured 2026-09-22: a
          # --dry-run prints `Skip v1.3.1 tag creation in dry-run mode` and then
          # `✔ Published release 1.3.1 on default channel`, so the log alone
          # cannot tell the two apart. The INPUT decides; the log only says
          # whether there was anything to release at all.
          #
          # `pipefail` above, or `tee` would swallow a failed release and this
          # would go on to redeploy after a release that never happened.
          if [ "$DRY_RUN" != "true" ] && grep -q "Published release" release.log; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      # A RELEASE IS A BUILD INPUT, AND THE EVENT CANNOT DELIVER IT.
      #
      # `deploy-frontend.yml` listens for `release: [published]` so the site
      # restamps itself with the version just cut. That trigger can never fire
      # from here: semantic-release authenticates with `secrets.GITHUB_TOKEN`,
      # and GitHub deliberately starts no workflow run from an event that token
      # raises. Measured 2026-09-22 - v1.3.1 published at 16:56:31Z and no
      # deploy run was created, so the live site kept advertising v1.3.0 until
      # somebody dispatched one by hand.
      #
      # That is the SAME symptom 93e61b8 added the trigger to fix, which is why
      # the fix is here rather than another trigger: this dispatch is an
      # ordinary `workflow_dispatch`, which does start a run.
      - name: Redeploy, so the site reports the version just cut
        if: steps.release.outputs.released == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'deploy-frontend.yml', ref: 'main',
            });
