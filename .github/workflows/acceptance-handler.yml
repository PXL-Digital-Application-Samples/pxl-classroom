name: Accept assignment
on:
  repository_dispatch:
    types: [acceptance]

permissions:
  contents: read
  actions: write # dispatches regenerate-dashboard.yml

# team_hint is the broker's title-derived team slug. It is a CONCURRENCY KEY
# ONLY - it serializes joins to one team, which is what guards team capacity
# without a distributed lock (ARCHITECTURE §5.6). The authoritative team comes
# from the `team` step below, which re-reads the issue in this repository.
concurrency:
  group: accept-${{ github.event.client_payload.org }}-${{ github.event.client_payload.assignment_id }}-${{ github.event.client_payload.team_hint || github.event.client_payload.github_login }}
  cancel-in-progress: false

jobs:
  accept:
    environment: provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: npm ci --omit=dev
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ github.event.client_payload.org }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.client_payload.org }}/pxl-classroom-control
          token: ${{ steps.token.outputs.token }}
          path: control
      # The broker is public and holds App credentials, so it forwards only the
      # issue number. The untrusted body is read and validated here instead.
      - name: Read team payload from broker issue
        id: team
        env:
          BROKER_REPO: ${{ github.event.client_payload.broker_repo }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          ORG: ${{ github.event.client_payload.org }}
          EXPECTED_LOGIN: ${{ github.event.client_payload.github_login }}
          # The concurrency group above was keyed on this. The script refuses a
          # body that names a different team, or per-team serialization - the
          # only thing guarding max_team_size - could be side-stepped by
          # disagreeing with your own title.
          TEAM_HINT: ${{ github.event.client_payload.team_hint }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: node scripts/read-team-payload.mjs

      - uses: ./acceptance
        id: accept
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ github.event.client_payload.org }}
          control-repo: pxl-classroom-control
          data-dir: control
          team-slug: ${{ steps.team.outputs.team_slug }}
          team-name: ${{ steps.team.outputs.team_name }}
          team-action: ${{ steps.team.outputs.team_action }}
          claim-payload: ${{ steps.team.outputs.claim_payload }}
          claim-verified: ${{ steps.team.outputs.claim_verified }}
          claim-private-key: ${{ secrets.PXL_CLAIM_PRIVATE_KEY }}
          claim-private-keys-retired: ${{ secrets.PXL_CLAIM_PRIVATE_KEYS_RETIRED }}
      - if: steps.accept.outputs.outcome == 'accepted' || steps.accept.outputs.outcome == 'already-accepted'
        uses: ./provisioning
        id: prov
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ github.event.client_payload.org }}
          assignment-id: ${{ steps.accept.outputs.assignment_id }}
          template-owner: ${{ steps.accept.outputs.template_owner }}
          template-repo: ${{ steps.accept.outputs.template_repo }}
          target-repo: ${{ steps.accept.outputs.target_repo }}
          student-login: ${{ steps.accept.outputs.github_login }}
          feedback-pr: ${{ steps.accept.outputs.feedback_pr }}
          feedback-pr-baseline-branch: ${{ steps.accept.outputs.feedback_pr_baseline_branch }}
          previous-repo: ${{ steps.accept.outputs.previous_repo }}
          
      # A rejection used to leave no trace a lecturer could find: nothing was
      # written to the control repo, and the only signal was a red run in the
      # hub's Actions tab, which belongs to a different org than the course. A
      # student saying "it won't let me accept" was unanswerable.
      #
      # Deduped per (assignment, login, reason), so a student retrying the same
      # closed door updates one comment instead of adding another.
      - name: Notify the lecturer of a rejected acceptance
        if: startsWith(steps.accept.outputs.outcome, 'rejected:')
        # A REJECTION IS AN OUTCOME, NOT A FAILURE, and that has to survive the
        # notification about it. accept.mjs exits 0 for `rejected:*` precisely so
        # a student who is not on the roster does not paint the hub's Actions tab
        # red - but notify.mjs throws on an API error, so a rate-limited comment
        # would have turned that same rejection into a failed run and buried real
        # failures beside it. The step still shows as failed, which is where a
        # broken notifier should be visible; the job does not.
        continue-on-error: true
        uses: ./notify
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ github.event.client_payload.org }}
          control-repo: pxl-classroom-control
          event-type: acceptance-rejected
          assignment-id: ${{ github.event.client_payload.assignment_id }}
          details: |
            `${{ github.event.client_payload.github_login }}` tried to accept and was turned away: **${{ steps.accept.outputs.outcome }}**

            ${{ steps.accept.outputs.reject_reason }}

            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          dedup-key: reject-${{ github.event.client_payload.assignment_id }}-${{ github.event.client_payload.github_login }}-${{ steps.accept.outputs.outcome }}

      # Tell the STUDENT, not only the lecturer.
      #
      # A rejection was recorded in two places a student cannot read - the
      # notifications issue and the claim-attempt record, both in the private
      # control repo - so their page had nothing to go on and guessed. It
      # offered "the registration cap has been reached" to somebody refused for
      # `rejected:no-claim`. The broker issue is the surface both sides already
      # share: the browser opened it and still holds its number.
      #
      # Only the CATEGORY crosses. The broker repository is public and the
      # rejection notes carry the address the student typed; the claim is sealed
      # so that address reaches nobody but the hub, and republishing it here
      # would undo that. See scripts/comment-acceptance-outcome.mjs.
      - name: Tell the student why they were turned away
        if: startsWith(steps.accept.outputs.outcome, 'rejected')
        # A courtesy comment must never turn a handled rejection into a red run.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ github.event.client_payload.org }}
          BROKER_REPO: ${{ github.event.client_payload.broker_repo }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          OUTCOME: ${{ steps.accept.outputs.outcome }}
        run: node scripts/comment-acceptance-outcome.mjs

      - name: Notify on failure
        if: always() && (steps.accept.outputs.outcome == 'accepted' || steps.accept.outputs.outcome == 'already-accepted') && startsWith(steps.prov.outputs.outcome, 'fail')
        # The provisioning failure is the thing to report; failing to report it
        # must not replace that signal with a different one. The steps after this
        # still have to run - the repository record is written by one of them.
        continue-on-error: true
        uses: ./notify
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ github.event.client_payload.org }}
          control-repo: pxl-classroom-control
          event-type: provisioning-failed
          assignment-id: ${{ steps.accept.outputs.assignment_id }}
          details: |
            Failed to provision repo for `${{ steps.accept.outputs.github_login }}`.
            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          dedup-key: prov-fail-${{ steps.accept.outputs.assignment_id }}-${{ steps.accept.outputs.github_login }}
          
      # A REJECTED claim still wrote something that has to survive: the
      # failed-attempt counter. The only commit step in this workflow is gated
      # on an ACCEPTED outcome, so every failure was written into the runner's
      # checkout and discarded - which makes MAX_CLAIM_ATTEMPTS unenforceable
      # and leaves the guessing oracle unbounded - the rate limit has to ship
      # WITH the gate rather than after it, because an unbounded guessing oracle
      # over enumerable addresses is not a follow-up.
      #
      # continue-on-error, for the same reason the notify steps carry it: a
      # rejection is an outcome and exits 0 on purpose, and a failed push about
      # one must not turn it into a red run.
      - name: Persist a failed claim attempt
        if: always() && startsWith(steps.accept.outputs.outcome, 'rejected:')
        continue-on-error: true
        env:
          LOGIN: ${{ github.event.client_payload.github_login }}
          OUTCOME: ${{ steps.accept.outputs.outcome }}
        run: |
          set -e
          # Each `run:` block is its own shell, so the stage() helper in the
          # step below does not exist here. `git add <dir>/` is fatal when the
          # directory is absent - see that step for the whole story.
          mkdir -p control/students
          git -C control add "students/"
          if git -C control diff --cached --quiet; then
            echo "nothing to persist for $OUTCOME"
            exit 0
          fi
          git -C control config user.name "pxl-classroom[bot]"
          git -C control config user.email "pxl-classroom[bot]@users.noreply.github.com"
          git -C control commit -m "Record failed claim attempt for ${LOGIN} (${OUTCOME})"
          scripts/git-push-with-retry.sh control

      - name: Write repository record into control checkout, push
        if: (success() || failure()) && (steps.accept.outputs.outcome == 'accepted' || steps.accept.outputs.outcome == 'already-accepted') && steps.prov.outputs.outcome != ''
        env:
          ASSIGNMENT_ID: ${{ steps.accept.outputs.assignment_id }}
          LOGIN: ${{ steps.accept.outputs.github_login }}
          TEAM_SLUG: ${{ steps.accept.outputs.team_slug }}
          OUTCOME: ${{ steps.prov.outputs.outcome }}
          ORG: ${{ github.event.client_payload.org }}
          TARGET_REPO: ${{ steps.accept.outputs.target_repo }}
          REPO_ID: ${{ steps.prov.outputs.repo-id }}
          REPO_URL: ${{ steps.prov.outputs.repo-url }}
          BASELINE_SHA: ${{ steps.prov.outputs.baseline-sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e

          # `git add <dir>/` is FATAL when the directory does not exist - exit
          # 128, and nothing at all is staged, not even the pathspecs that did
          # match. Under `set -e` that kills this whole step, so the student's
          # repository is created and then the repository record, the
          # acceptance status update AND the claim binding are all discarded.
          #
          # It is latent rather than theoretical: `teams/` was added to the
          # staging list on 2026-08-19 with group assignments, and a control
          # repo that has never run a group assignment has no teams/ directory
          # (git cannot store an empty one). PXL-Automation-II is exactly that
          # - its six exam acceptances were provisioned on 2026-08-03, before
          # the change, and no acceptance has run there since. The next one
          # would have been the first to hit it.
          #
          # The fix is `mkdir -p` before each add, not a conditional around it.
          # `git add` on an EXISTING but empty directory exits 0 and stages
          # nothing, so creating it first is a no-op when there was nothing to
          # commit and correct when there was - where a `[ -d ]` guard would
          # silently skip a directory that did have content if anything ever
          # went wrong upstream.
          #
          # Explicit paths rather than `git add -A`: staging only what this job
          # writes is what stops a stray file reaching a course's control repo.
          if [ "$OUTCOME" = "created" ] || [ "$OUTCOME" = "reused" ]; then
            node scripts/write-repository-record.mjs \
              --assignment-id "$ASSIGNMENT_ID" \
              --login "$LOGIN" \
              --org "$ORG" \
              --target-repo "$TARGET_REPO" \
              --team-slug "$TEAM_SLUG" \
              --repo-id "$REPO_ID" \
              --repo-url "$REPO_URL" \
              --baseline-sha "$BASELINE_SHA" \
              --run-url "$RUN_URL" \
              --data-dir control
            mkdir -p control/repositories control/teams
            git -C control add "repositories/" "teams/"
          fi

          ACCEPT_FILE="acceptances/${ASSIGNMENT_ID}/${LOGIN}.json"
          if [ -f "control/$ACCEPT_FILE" ]; then
            if [ "$OUTCOME" = "created" ] || [ "$OUTCOME" = "reused" ]; then
              node scripts/update-json-field.mjs --schema acceptance "control/$ACCEPT_FILE" "status" "provisioned"
            else
              node scripts/update-json-field.mjs --schema acceptance "control/$ACCEPT_FILE" "status" "failed"
            fi
            mkdir -p control/acceptances
            git -C control add "acceptances/"
          fi

          # students/ holds the claim binding (students/claims/<id>.json). It
          # was not staged, so the binding was written into the runner's
          # checkout and thrown away: the claim worked once and bound nothing.
          # Found by running it - the drill's acceptance succeeded and the
          # binding 404'd afterwards.
          mkdir -p control/students
          git -C control add "students/"

          git -C control config user.name "pxl-classroom[bot]"
          git -C control config user.email "pxl-classroom[bot]@users.noreply.github.com"
          git -C control diff --cached --quiet || git -C control commit -m "Provision ${LOGIN} for ${ASSIGNMENT_ID} (${OUTCOME})"
          scripts/git-push-with-retry.sh control
          
      # The trigger issue's title carried the assignment's signed invitation and
      # the broker is PUBLIC, so closing it hides nothing: a closed, locked issue
      # is still readable, still listed and still returned by GitHub's issue
      # search. The first student to accept would otherwise publish the token to
      # anyone who looked - which defeats §4.3.2 outright and, because the
      # acceptance card is named sha256(token), makes the card and its teams file
      # public too (§4.3.3).
      #
      # THE HUB DOES NOT DELETE THE ISSUE, AND CANNOT. Do not add it back.
      #
      # A `deleteIssue` step lived here for months and had never once succeeded.
      # Measured live on 2026-08-26, twice, in two different organizations:
      #
      #   {"type":"FORBIDDEN","path":["deleteIssue"],
      #    "message":"Viewer not authorized to delete"}
      #
      # It is NOT a missing permission, which is what the step's own warning
      # asserted while sending the error to /dev/null. Both organizations grant
      # the App `administration: write`; the same installation token had read
      # this very issue two steps earlier; and in the publish run that created
      # this broker the same token created the repository and wrote its secrets
      # and variables, all of which need admin. The identical mutation succeeds
      # immediately with a USER token holding repository admin.
      #
      # GitHub documents none of this - the mutation's schema description is
      # "Deletes an Issue object." and neither the permissions reference nor the
      # GraphQL limitations page mentions it - but its community answer for the
      # same error on GITHUB_TOKEN, itself an installation token, is "use a
      # personal access token". This system deliberately holds no PAT, and
      # adding a long-lived user credential to the hub to tidy a public issue
      # would trade §4.3.4 away for housekeeping.
      #
      # What actually protects the title is the broker REDACTING it within
      # seconds (acceptance/broker-workflow.yml), and since §4.3.2's signed
      # acceptance the title is a signature naming one account rather than a
      # credential - so what remains in the issue timeline grants nobody
      # anything. System Health Tier 4 still sweeps for titles that were never
      # redacted, which is the signal that actually means something.

      - name: Trigger dashboard regeneration
        if: always() && (steps.accept.outputs.outcome == 'accepted' || steps.accept.outputs.outcome == 'already-accepted')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ORG: ${{ github.event.client_payload.org }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'regenerate-dashboard.yml', ref: 'main',
              inputs: { org: process.env.ORG },
            });
