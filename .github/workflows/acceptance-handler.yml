name: Accept assignment
# THE RUN IS NAMED AFTER THE STUDENT'S ATTEMPT, so their page can find it in
# this public repository's run list and say which step their request is at -
# waiting for GitHub to start it, running, or stopped (lib/acceptance-run-name.mjs,
# which the page builds the same string from). Both halves are already public:
# the issue sits on a public broker and names its author. A display string,
# never a script.
run-name: acceptance ${{ github.event.client_payload.broker_repo }}#${{ github.event.client_payload.issue_number }}
on:
  repository_dispatch:
    types: [acceptance]

permissions:
  contents: read
  actions: write # dispatches regenerate-dashboard.yml

# NO CONCURRENCY GROUP, deliberately - do not add one back.
#
# Joins to a team were serialised here with `accept-<org>-<id>-<team_hint>`.
# GitHub keeps ONE pending run per group and the newest arrival cancels it, and
# a run that never gets a runner holds the group for up to 24 hours, because
# timeout-minutes only counts a running job. On 2026-10-02 one join to a team
# sat queued for twenty minutes and the seven behind it cancelled each other;
# two students ended in no team (LESSONS.md). `queue: max` (2026-05) lifts the
# one-pending limit but not the stuck run.
#
# What the group protected - a team's size, one team per student - is now kept
# by the decision itself: it is saved before anything is provisioned, by a push
# GitHub refuses when another run saved first, and decided again when that run
# changed one of its inputs (acceptance/reserve.mjs,
# lib/acceptance-reservation.mjs). A run that is stuck, cancelled or late
# blocks nobody but itself, and an older attempt that lands late is
# `superseded` rather than undoing a newer one.

jobs:
  accept:
    environment: provisioning
    runs-on: ubuntu-latest
    # Saving the decision and the record each retry for up to ~3 minutes in a
    # class-wide burst (acceptance/reserve.mjs, scripts/record-acceptance.sh),
    # around provisioning. Well inside the App token's hour.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm ci --omit=dev
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ github.event.client_payload.org }}
          # Every repository, because the broker is named by the payload and
          # validated after this. The control repo push, and reading and
          # labelling the acceptance issue (lib/app-token-scopes.mjs).
          permission-contents: write
          permission-issues: write
          permission-metadata: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.client_payload.org }}/pxl-classroom-control
          token: ${{ steps.token.outputs.token }}
          path: control
      # The broker is public and holds App credentials, so it forwards only the
      # issue number. The untrusted body is read and validated here instead.
      - name: Read team payload from broker issue
        id: team
        env:
          BROKER_REPO: ${{ github.event.client_payload.broker_repo }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          ORG: ${{ github.event.client_payload.org }}
          EXPECTED_LOGIN: ${{ github.event.client_payload.github_login }}
          # The team the issue's TITLE names. The script refuses a body that
          # names a different one: the page always sends them in agreement, so
          # a disagreement is a hand-made issue.
          TEAM_HINT: ${{ github.event.client_payload.team_hint }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: node scripts/read-team-payload.mjs

      - uses: ./acceptance
        id: accept
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ github.event.client_payload.org }}
          control-repo: pxl-classroom-control
          data-dir: control
          team-slug: ${{ steps.team.outputs.team_slug }}
          team-name: ${{ steps.team.outputs.team_name }}
          team-action: ${{ steps.team.outputs.team_action }}
          # Straight off the dispatch, and it is safe there BECAUSE the broker
          # took it from the verifier rather than the title: the signature
          # covers the purpose. Absent is `accept`, which is what every dispatch
          # predating confirmation meant. accept.mjs refuses any other value
          # rather than reading an unknown one as either.
          kind: ${{ github.event.client_payload.kind }}
          claim-payload: ${{ steps.team.outputs.claim_payload }}
          claim-verified: ${{ steps.team.outputs.claim_verified }}
          claim-private-key: ${{ secrets.PXL_CLAIM_PRIVATE_KEY }}
          claim-private-keys-retired: ${{ secrets.PXL_CLAIM_PRIVATE_KEYS_RETIRED }}
          # Both read back from the issue by the step above, never off the
          # dispatch: which attempt this is, and when the student made it.
          issue-number: ${{ steps.team.outputs.issue_number }}
          acted-at: ${{ steps.team.outputs.acted_at }}
      - if: steps.accept.outputs.outcome == 'accepted' || steps.accept.outputs.outcome == 'already-accepted'
        uses: ./provisioning
        id: prov
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ github.event.client_payload.org }}
          assignment-id: ${{ steps.accept.outputs.assignment_id }}
          template-owner: ${{ steps.accept.outputs.template_owner }}
          template-repo: ${{ steps.accept.outputs.template_repo }}
          template-repository-id: ${{ steps.accept.outputs.template_repository_id }}
          target-repo: ${{ steps.accept.outputs.target_repo }}
          student-login: ${{ steps.accept.outputs.github_login }}
          feedback-pr: ${{ steps.accept.outputs.feedback_pr }}
          feedback-pr-baseline-branch: ${{ steps.accept.outputs.feedback_pr_baseline_branch }}
          previous-repo: ${{ steps.accept.outputs.previous_repo }}
          recreate-empty: ${{ steps.accept.outputs.own_earlier_attempt }}
          student-permission: ${{ steps.accept.outputs.student_permission }}
          
      # A rejection used to leave no trace a lecturer could find: nothing was
      # written to the control repo, and the only signal was a red run in the
      # hub's Actions tab, which belongs to a different org than the course. A
      # student saying "it won't let me accept" was unanswerable.
      #
      # Deduped per (assignment, login, reason), so a student retrying the same
      # closed door updates one comment instead of adding another.
      - name: Notify the lecturer of a rejected acceptance
        if: startsWith(steps.accept.outputs.outcome, 'rejected:')
        # A REJECTION IS AN OUTCOME, NOT A FAILURE, and that has to survive the
        # notification about it. accept.mjs exits 0 for `rejected:*` precisely so
        # a student who is not on the roster does not paint the hub's Actions tab
        # red - but notify.mjs throws on an API error, so a rate-limited comment
        # would have turned that same rejection into a failed run and buried real
        # failures beside it. The step still shows as failed, which is where a
        # broken notifier should be visible; the job does not.
        continue-on-error: true
        uses: ./notify
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ github.event.client_payload.org }}
          control-repo: pxl-classroom-control
          event-type: acceptance-rejected
          assignment-id: ${{ github.event.client_payload.assignment_id }}
          details: |
            `${{ github.event.client_payload.github_login }}` ${{ github.event.client_payload.kind == 'confirm' && 'tried to confirm their email address' || 'tried to accept' }} and was turned away: **${{ steps.accept.outputs.outcome }}**

            ${{ steps.accept.outputs.reject_reason }}

            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          dedup-key: reject-${{ github.event.client_payload.assignment_id }}-${{ github.event.client_payload.github_login }}-${{ steps.accept.outputs.outcome }}

      # Tell the STUDENT, not only the lecturer - with a LABEL, not a comment.
      #
      # A rejection was recorded in two places a student cannot read (the
      # notifications issue and the claim-attempt record, both in the private
      # control repo), so their page had nothing to go on and guessed: it
      # offered "the registration cap has been reached" to somebody refused for
      # `rejected:no-claim`. The broker issue is the surface both sides already
      # share - the browser opened it and still holds its number.
      #
      # A COMMENT EMAILS THEM. The student authored that issue, so GitHub
      # subscribes them to it; a student reported "Re: Acceptance (processed) -
      # Closed #1 has been completed" arriving in their inbox, which is mail
      # about internal plumbing. Metadata is silent, and labelling a LOCKED
      # issue returns 200 where commenting was returning 403. A label also
      # cannot be forged: applying one needs triage or write access, which a
      # student does not have on a broker.
      #
      # Two labels exist and no more - lib/acceptance-labels.mjs. A per-reason
      # label is filterable in one click, which would turn a public broker into
      # a sortable list of which named students are not on the roster.
      - name: Tell the student their repository is waiting on an invitation
        # The grant returned 201, the only evidence anywhere that GitHub sent an
        # invitation: measured 2026-09-03, the student's own token gets `200 []`
        # from /user/repository_invitations and 403 from
        # /user/memberships/orgs/{org}, so their page can see neither the
        # invitation nor the org membership that would imply it. A 204 grant
        # earns no label - the repository is readable at once.
        if: steps.prov.outputs.invited == 'true'
        # A courtesy label must never turn a successful provisioning red.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ github.event.client_payload.org }}
          BROKER_REPO: ${{ github.event.client_payload.broker_repo }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          OUTCOME: provisioned:invited
        run: node scripts/publish-acceptance-outcome.mjs

      - name: Tell the student they were turned away
        if: startsWith(steps.accept.outputs.outcome, 'rejected') && steps.accept.outputs.outcome != 'rejected:repo-unreadable'
        # A courtesy label must never turn a handled rejection into a red run.
        continue-on-error: true
        # EXCEPT when nothing turned them away: `rejected:repo-unreadable` means
        # GitHub did not answer whether their repository name is free. The
        # lecturer is still told (the notice above); the student is not told
        # "your lecturer can see the reason" about GitHub's error. Their page
        # sees a finished run with no answer and offers to try again, and the
        # nightly lists the attempt if they do not (lib/unanswered-attempts.mjs).
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ github.event.client_payload.org }}
          BROKER_REPO: ${{ github.event.client_payload.broker_repo }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          OUTCOME: ${{ steps.accept.outputs.outcome }}
        run: node scripts/publish-acceptance-outcome.mjs

      - name: Notify on failure
        if: always() && (steps.accept.outputs.outcome == 'accepted' || steps.accept.outputs.outcome == 'already-accepted') && startsWith(steps.prov.outputs.outcome, 'fail')
        # The provisioning failure is the thing to report; failing to report it
        # must not replace that signal with a different one. The steps after this
        # still have to run - the repository record is written by one of them.
        continue-on-error: true
        uses: ./notify
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ github.event.client_payload.org }}
          control-repo: pxl-classroom-control
          event-type: provisioning-failed
          assignment-id: ${{ steps.accept.outputs.assignment_id }}
          details: |
            Failed to provision repo for `${{ steps.accept.outputs.github_login }}`.
            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          dedup-key: prov-fail-${{ steps.accept.outputs.assignment_id }}-${{ steps.accept.outputs.github_login }}
          
      # NOTHING ELSE COMMITS A DECISION. ./acceptance saves what accept.mjs
      # wrote for EVERY outcome before it returns - an admitted acceptance or
      # confirmation in full, a refusal's attempt counter, a superseded attempt
      # nothing (lib/acceptance-reservation.mjs `pathsToCommit`, which
      # tests/acceptance-outcome-persisted.test.mjs holds exhaustive). A
      # separate "persist" step lived here, gated on a list of outcomes; two
      # features were silently discarded in the seam between that list and
      # accept.mjs before it became a class, and the class now lives beside the
      # code that saves it.

      # Writes what PROVISIONING produced: the repository record, the team's
      # repository, the acceptance's status. Re-applied on the latest state
      # rather than rebased, and only while this run still owns the decision -
      # scripts/record-acceptance.sh, shared with retry-acceptance.yml.
      - name: Write repository record into control checkout, push
        id: record
        if: (success() || failure()) && (steps.accept.outputs.outcome == 'accepted' || steps.accept.outputs.outcome == 'already-accepted') && steps.prov.outputs.outcome != ''
        env:
          ASSIGNMENT_ID: ${{ steps.accept.outputs.assignment_id }}
          LOGIN: ${{ steps.accept.outputs.github_login }}
          TEAM_SLUG: ${{ steps.accept.outputs.team_slug }}
          OUTCOME: ${{ steps.prov.outputs.outcome }}
          ORG: ${{ github.event.client_payload.org }}
          TARGET_REPO: ${{ steps.accept.outputs.target_repo }}
          REPO_ID: ${{ steps.prov.outputs.repo-id }}
          REPO_URL: ${{ steps.prov.outputs.repo-url }}
          BASELINE_SHA: ${{ steps.prov.outputs.baseline-sha }}
          STUDENT_PERMISSION: ${{ steps.accept.outputs.student_permission }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_LABEL: Provision
          DATA_DIR: control
        run: scripts/record-acceptance.sh

      # A REPOSITORY NOBODY RECORDED IS A STUDENT NOBODY LOCKS, ARCHIVES OR
      # GRADES - and the student cannot tell, because their side worked.
      #
      # When the push above fails the repository exists, the invitation is sent
      # and the control repo has no acceptance and no repository record. The
      # only notice in this job fired on a PROVISIONING failure, so this one
      # went red in the hub's Actions tab and reached nobody: TimoHubner444 sat
      # outside PXL-SNB-Security-Expert2627's student list for two days
      # (2026-09-28, thirteen acceptances in one minute, five lost pushes)
      # until somebody read the hub's runs. The fix the lecturer needs is one
      # click, so the notice names the student and the click. The nightly also
      # looks for the same state from the other side
      # (scripts/find-unrecorded-repos.mjs).
      - name: Notify the lecturer of a repository that was not recorded
        if: failure() && steps.record.outcome == 'failure'
        continue-on-error: true
        uses: ./notify
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ github.event.client_payload.org }}
          control-repo: pxl-classroom-control
          event-type: provisioning-failed
          assignment-id: ${{ steps.accept.outputs.assignment_id }}
          details: |
            `${{ steps.accept.outputs.github_login }}` accepted and their repository exists, but it could not be recorded, so they are missing from the student list and would be left out at the deadline.

            Press **Retry** for them on the assignment page. It keeps their repository and their work.

            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          dedup-key: record-fail-${{ steps.accept.outputs.assignment_id }}-${{ steps.accept.outputs.github_login }}

      # The trigger issue's title carried the assignment's signed invitation and
      # the broker is PUBLIC, so closing it hides nothing: a closed, locked issue
      # is still readable, still listed and still returned by GitHub's issue
      # search. The first student to accept would otherwise publish the token to
      # anyone who looked - which defeats §4.3.2 outright and, because the
      # acceptance card is named sha256(token), makes the card and its teams file
      # public too (§4.3.3).
      #
      # THE HUB DOES NOT DELETE THE ISSUE, AND CANNOT. Do not add it back.
      #
      # A `deleteIssue` step lived here for months and had never once succeeded.
      # Measured live on 2026-08-26, twice, in two different organizations:
      #
      #   {"type":"FORBIDDEN","path":["deleteIssue"],
      #    "message":"Viewer not authorized to delete"}
      #
      # It is NOT a missing permission, which is what the step's own warning
      # asserted while sending the error to /dev/null. Both organizations grant
      # the App `administration: write`; the same installation token had read
      # this very issue two steps earlier; and in the publish run that created
      # this broker the same token created the repository and wrote its secrets
      # and variables, all of which need admin. The identical mutation succeeds
      # immediately with a USER token holding repository admin.
      #
      # GitHub documents none of this - the mutation's schema description is
      # "Deletes an Issue object." and neither the permissions reference nor the
      # GraphQL limitations page mentions it - but its community answer for the
      # same error on GITHUB_TOKEN, itself an installation token, is "use a
      # personal access token". This system deliberately holds no PAT, and
      # adding a long-lived user credential to the hub to tidy a public issue
      # would trade §4.3.4 away for housekeeping.
      #
      # What actually protects the title is the broker REDACTING it within
      # seconds (acceptance/broker-workflow.yml), and since §4.3.2's signed
      # acceptance the title is a signature naming one account rather than a
      # credential - so what remains in the issue timeline grants nobody
      # anything. System Health Tier 4 still sweeps for titles that were never
      # redacted, which is the signal that actually means something.

      - name: Trigger dashboard regeneration
        if: always() && (steps.accept.outputs.outcome == 'accepted' || steps.accept.outputs.outcome == 'already-accepted')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ORG: ${{ github.event.client_payload.org }}
          # lib/github-api-version.mjs, which YAML cannot import; the test
          # tests/github-api-version.test.mjs holds this equal to it.
          GITHUB_API_VERSION: "2026-03-10"
        with:
          script: |
            github.hook.before('request', (o) => { o.headers = { ...o.headers, 'x-github-api-version': process.env.GITHUB_API_VERSION }; });
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'regenerate-dashboard.yml', ref: 'main',
              inputs: { org: process.env.ORG },
            });
