name: Regenerate Dashboard Data
on:
  workflow_dispatch:
    inputs:
      org: { type: string }

permissions:
  contents: read
jobs:
  find-orgs:
    uses: ./.github/workflows/_find-orgs.reusable.yml
    with:
      org: ${{ inputs.org }}

  generate:
    environment: provisioning
    needs: find-orgs
    if: needs.find-orgs.outputs.orgs != '[]'
    strategy:
      matrix:
        org: ${{ fromJSON(needs.find-orgs.outputs.orgs) }}
      max-parallel: 4
      fail-fast: false
    concurrency:
      group: dashboard-${{ matrix.org }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `actions: write` to switch the nightly on (the last step); a job-level
    # block replaces the workflow's, so `contents: read` is restated.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --omit=dev
      - name: Mint App token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}
          # The control repo only: checkout and push (contents), and the issue
          # notifications report.mjs sends when generate-interim-reports.mjs runs
          # it with this token. ./pages takes no token (lib/app-token-scopes.mjs).
          repositories: pxl-classroom-control
          permission-contents: write
          permission-issues: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: control
        with:
          repository: ${{ matrix.org }}/pxl-classroom-control
          token: ${{ steps.token.outputs.token }}
          path: control

      - name: Generate and scan
        uses: ./pages
        with:
          data-dir: "control"
          output-dir: "control/public"

      - name: Generate interim reports
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ matrix.org }}
        run: |
          node scripts/generate-interim-reports.mjs control

      # Reconcile the dashboard against the assignments that still exist.
      #
      # Separate from the step above, and `always()`, because the prune used to
      # live INSIDE report.mjs - so it ran only as a side effect of generating
      # some other assignment's report. The step above generates reports for
      # `published` and `closed` assignments only, so an organization whose
      # remaining assignments are all draft or archived reconciled nothing and
      # kept a deleted assignment's card indefinitely. Reads one directory and
      # rewrites one file; the commit step below carries it.
      # ...but only over a control repository that was checked out: a token
      # GitHub would not mint left none, and the steps below then failed a
      # second time over a missing directory, burying the real cause.
      - name: Prune dashboard entries with no assignment
        if: always() && steps.control.outcome == 'success'
        run: |
          node scripts/prune-dashboard.mjs control

      # `always()`, because generate-interim-reports.mjs now exits non-zero when
      # some reports could not be generated. The ones that DID generate are
      # already on disk, and abandoning them would mean the dashboard serves
      # yesterday's numbers for every assignment rather than only the failed
      # ones. Same pairing open-feedback-prs.yml uses for the same reason.
      - name: Commit public data and reports
        if: always() && steps.control.outcome == 'success'
        shell: bash
        run: |
          set -e
          git -C control config user.name "pxl-classroom[bot]"
          git -C control config user.email "pxl-classroom[bot]@users.noreply.github.com"
          # See daily-activity.yml: a missing pathspec makes `git add` stage
          # nothing at all, and `|| true` turns that into a green "No changes."
          mkdir -p control/public control/reports
          git -C control add public/ reports/
          if git -C control diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git -C control commit -m "Regenerate dashboard data and reports [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          scripts/git-push-with-retry.sh control

      # WORK OWED KEEPS THE NIGHTLY ON (review 2026-10-16, R7-13). The nightly
      # switches itself off when nothing is active, and only a publish switched
      # it on again - so a Retry after every deadline (a repository nothing
      # locks), or a save that moves a closed assignment's deadline later
      # without publishing, was owed a nightly that never ran. Both rebuild
      # this organization's pages, which is this run. The queue's own count
      # decides (scripts/find-finalizable.mjs `active`), so this switches it
      # on exactly when the nightly would keep itself on. Never fails a rebuild.
      - name: Keep the nightly on while this organization owes it work
        if: always() && steps.control.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ matrix.org }}
          # lib/github-api-version.mjs, which YAML cannot import; the test
          # tests/github-api-version.test.mjs holds this equal to it.
          GITHUB_API_VERSION: "2026-03-10"
        run: scripts/keep-nightly-on.sh control "$ORG"

  deploy-pages:
    needs: [find-orgs, generate]
    if: always() && needs.find-orgs.outputs.orgs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Trigger frontend and data deployment
        # Asked again on failure: this dispatch is the only thing that puts a
        # publish or an acceptance on the student pages, and a 5xx here left
        # them out of date until the next change anywhere. A second dispatch is
        # harmless - deploy-frontend.yml keeps only the newest one waiting.
        # gh writes GitHub's error to stdout, so it is kept and said, and the
        # last attempt does not wait before giving up.
        run: |
          for attempt in 1 2 3; do
            if ! ANSWER=$(gh api -H "X-GitHub-Api-Version: ${GITHUB_API_VERSION}" --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-frontend.yml/dispatches" \
              -f ref=main 2>&1); then
              echo "::warning::Dispatching the Pages deploy failed (attempt ${attempt} of 3): ${ANSWER:0:300}"
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
              continue
            fi
            exit 0
          done
          echo "::error::The Pages deploy could not be dispatched: the student pages update on the next change."
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # lib/github-api-version.mjs, which YAML cannot import; the test
          # tests/github-api-version.test.mjs holds this equal to it.
          GITHUB_API_VERSION: "2026-03-10"
