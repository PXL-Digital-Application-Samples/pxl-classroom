name: Open Feedback PRs
on:
  workflow_dispatch:
    inputs:
      org:
        description: "Organization"
        required: true
        type: string
      assignment_id:
        description: "Assignment ID"
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  open-prs:
    environment: provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      
      - name: Mint App token for Org
        id: token
        # Same fault as sync-starter-code.yml: v1 has no `client-id` input, so
        # this failed with "Input required and not supplied: app-id" before the
        # job could start. Pinned to the SHA every other workflow uses.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ inputs.org }}
          
      - name: Checkout control repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.org }}/pxl-classroom-control
          token: ${{ steps.token.outputs.token }}
          path: control

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --omit=dev

      - name: Open Feedback PRs
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ inputs.org }}
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
          DATA_DIR: control
        run: |
          node scripts/open-feedback-prs.mjs

      # `always()`: the script exits non-zero on partial failure, and the
      # records for the pull requests that DID open are already on disk.
      # Abandoning them would make the next run rediscover every one through
      # the adopt path - the same reason daily-activity commits its lockdown
      # record after a failed leg.
      - name: Commit updated repository records
        if: always()
        working-directory: control
        env:
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
        run: |
          git config user.name "PXL Classroom Provisioner"
          git config user.email "pxl-classroom@users.noreply.github.com"
          if [ -n "$(git status --porcelain repositories/)" ]; then
            mkdir -p repositories
            git add repositories/
            git commit -m "Record feedback PRs for ${ASSIGNMENT_ID}"
            git push
          else
            echo "No repository record updates to commit."
          fi
