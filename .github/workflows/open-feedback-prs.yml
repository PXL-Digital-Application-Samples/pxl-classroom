name: Open Feedback PRs
on:
  workflow_dispatch:
    inputs:
      org:
        description: "Organization"
        required: true
        type: string
      assignment_id:
        description: "Assignment ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  open-prs:
    environment: provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # See sync-starter-code.yml for the whole reasoning: this job holds
      # PXL_APP_PRIVATE_KEY and mints a token for an arbitrary org from its own
      # input, and a stolen broker credential reaches workflow_dispatch as
      # `<app-slug>[bot]`. These two were the only dispatch-triggered workflows
      # carrying the App key without the guard.
      - name: Reject automated dispatch
        if: github.event_name == 'workflow_dispatch' && endsWith(github.actor, '[bot]')
        env:
          ACTOR: ${{ github.actor }}
        run: |
          echo "::error::$ACTOR may not dispatch this workflow; a lecturer must run it"
          exit 1

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      
      - name: Mint App token for Org
        id: token
        # Same fault as sync-starter-code.yml: v1 has no `client-id` input, so
        # this failed with "Input required and not supplied: app-id" before the
        # job could start. Pinned to the SHA every other workflow uses.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ inputs.org }}
          
      - name: Checkout control repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.org }}/pxl-classroom-control
          token: ${{ steps.token.outputs.token }}
          path: control

      # Pinned to a SHA, like every other action in the repo. See
      # sync-starter-code.yml: this ran as a mutable `@v4` tag in a step that
      # follows the App-token mint, so a compromised tag executed beside both the
      # installation token and PXL_APP_PRIVATE_KEY.
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - run: npm ci --omit=dev

      - name: Open Feedback PRs
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ inputs.org }}
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
          DATA_DIR: control
        run: |
          node scripts/open-feedback-prs.mjs

      # `always()`: the script exits non-zero on partial failure, and the
      # records for the pull requests that DID open are already on disk.
      # Abandoning them would make the next run rediscover every one through
      # the adopt path - the same reason daily-activity commits its lockdown
      # record after a failed leg.
      - name: Commit updated repository records
        if: always()
        working-directory: control
        env:
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
        run: |
          git config user.name "PXL Classroom Provisioner"
          git config user.email "pxl-classroom@users.noreply.github.com"
          if [ -n "$(git status --porcelain repositories/)" ]; then
            mkdir -p repositories
            git add repositories/
            git commit -m "Record feedback PRs for ${ASSIGNMENT_ID}"
            # A bare push loses to any concurrent write to this control repo -
            # the nightly, a dashboard regeneration and every acceptance all
            # commit here. The helper rebases and retries, and FAILS if it
            # cannot, rather than reporting success over a lost record.
            ../scripts/git-push-with-retry.sh
          else
            echo "No repository record updates to commit."
          fi
