name: Daily Activity & Deadline Check
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      org: { type: string }
      # Exercises the run-failed notification without waiting for a real
      # failure. Takes an organization LOGIN rather than a boolean, and fails
      # only that organization's collect leg, so the blast radius is one issue
      # in one control repo - the org you name.
      #
      # A boolean was the obvious shape and is the wrong one: it would fail
      # every leg of the matrix and post to every participating organization,
      # which is the accident this notification was reverted for once already
      # (1b0bcbc). Naming the target is what makes it safe to run against
      # `pxl-classroom-testbed` on a working day.
      simulate_failure_org:
        description: >-
          TESTING ONLY. Organization login whose collect step should fail on
          purpose, to prove the run-failed notification reaches its issue.
          Leave blank for normal operation.
        type: string
        default: ''

permissions:
  contents: read
jobs:
  find-orgs:
    uses: ./.github/workflows/_find-orgs.reusable.yml
    with:
      org: ${{ inputs.org }}

  disable-when-empty:
    needs: find-orgs
    # ONLY A RUN THAT COVERED EVERY ORG MAY DISABLE THE NIGHTLY. A dispatch
    # naming one org narrows find-orgs to that org, so a typo'd or
    # non-participating name yields `[]` here - which is a statement about the
    # input, not about the hub - and switching off the workflow for every
    # organization on the strength of it is a decision made on a truncated read.
    if: >-
      needs.find-orgs.outputs.orgs == '[]'
      && (github.event_name != 'workflow_dispatch' || inputs.org == '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Disable daily-activity (no participating orgs)
        run: |
          echo "No participating orgs registered. Disabling daily-activity.yml until next publish."
          gh workflow disable daily-activity.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  collect:
    environment: provisioning
    needs: find-orgs
    if: needs.find-orgs.outputs.orgs != '[]'
    strategy:
      matrix:
        org: ${{ fromJSON(needs.find-orgs.outputs.orgs) }}
      max-parallel: 4
      fail-fast: false
    concurrency:
      group: collect-${{ matrix.org }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: npm ci --omit=dev
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ matrix.org }}/pxl-classroom-control
          token: ${{ steps.token.outputs.token }}
          path: control
      # Placed AFTER both checkouts, so the failure it stages is the realistic
      # one: the job is fully set up and something inside it dies. A failure
      # before the hub checkout cannot be reported at all, and pretending to
      # test that case would prove the opposite of what it claims.
      - name: Fail on purpose (simulate_failure_org)
        if: inputs.simulate_failure_org != '' && matrix.org == inputs.simulate_failure_org
        env:
          ORG: ${{ matrix.org }}
        run: |
          echo "simulate_failure_org names this organization; failing deliberately." >&2
          echo "Nothing has been written to ${ORG}. This is a notification test." >&2
          exit 1

      - uses: ./collect
        id: collect_action
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ matrix.org }}
          assignment-id: ''
          collection-type: scheduled
          data-dir: control

      # Fold GitHub-VERIFIED claims into the roster, so a lecturer has no step
      # to find. Only the unambiguous ones: a typed address, a conflict or an
      # address two accounts claim is a decision, and it is left for a human.
      # Here rather than in its own workflow because this job already has the
      # control repo checked out, is serialised per org, and already commits -
      # so it costs no Actions minutes of its own.
      - name: Link verified claims into the roster
        if: always()
        run: node scripts/link-claims.mjs --data-dir control

      - name: Commit + push to control repo
        if: always()
        run: |
          set -e
          git -C control config user.name "pxl-classroom[bot]"
          git -C control config user.email "pxl-classroom[bot]@users.noreply.github.com"
          mkdir -p control/observations control/students
          git -C control add observations/ students/
          if git -C control diff --cached --quiet; then exit 0; fi
          git -C control commit -m "Collect activity"
          scripts/git-push-with-retry.sh control

      # Reported from INSIDE the job that knows which organization it is.
      #
      # The first version of this was a separate job gated on `failure()`, which
      # at job level is true when ANY dependency failed - and
      # `needs.collect.result` is the aggregate of this whole matrix. One
      # organization's leg failing would have mailed a "your nightly did not
      # finish" comment to all thirteen, twelve of them wrongly. Reverted in
      # 1b0bcbc; an issue comment mails every watcher, and a false alarm nobody
      # can act on is how the channel RUNBOOK §2.1 calls a daily checklist stops
      # being read.
      #
      # A step sees only its own job, so this reports exactly one organization.
      # It covers every failure from the runner starting onwards, including a
      # control-repo checkout that could not clone. What it cannot cover is the
      # HUB checkout failing - `./notify` lives in the repository that did not
      # check out - and that case is still visible only on the Actions tab.
      #
      # continue-on-error: the collection failure is the thing to report, and
      # failing to report it must not replace that signal with a different one.
      - name: Report this org's failure
        if: failure()
        continue-on-error: true
        uses: ./notify
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ matrix.org }}
          control-repo: pxl-classroom-control
          event-type: run-failed
          assignment-id: nightly-collect
          details: |
            Tonight's collection did not finish for this organization. Observations
            may be incomplete, and the dashboard will be stale until a run succeeds.

            Nothing is lost: collection is re-run every night, and a deadline that
            passed in the meantime is still enforced from the commit timestamps
            rather than from when the collector looked.

            Act on this if it appears two nights running.

            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          dedup-key: run-failed-collect-${{ matrix.org }}

  find-finalizable:
    environment: provisioning
    needs: [find-orgs, collect]
    if: always() && needs.find-orgs.outputs.orgs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        org: ${{ fromJSON(needs.find-orgs.outputs.orgs) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - run: npm ci --omit=dev
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ matrix.org }}/pxl-classroom-control
          token: ${{ steps.token.outputs.token }}
          path: control
      - id: find
        env:
          ORG: ${{ matrix.org }}
        run: |
          node scripts/find-finalizable.mjs control "$ORG" > "finalizable-${ORG}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finalizable-${{ matrix.org }}
          path: finalizable-${{ matrix.org }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: active-${{ matrix.org }}
          path: active-${{ matrix.org }}.json

      # Per organization, for the reason given in the collect job above.
      - name: Report this org's failure
        if: failure()
        continue-on-error: true
        uses: ./notify
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ matrix.org }}
          control-repo: pxl-classroom-control
          event-type: run-failed
          assignment-id: nightly-finalizable-scan
          details: |
            The nightly could not work out which of this organization's assignments
            are ready to finalize, so none of them were locked down or preserved
            tonight.

            An assignment past its deadline stays queued and is retried on the next
            run; the submission is reconstructed from commits made before the
            deadline either way, so a night's delay does not change anyone's grade.

            Act on this if it appears two nights running.

            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          dedup-key: run-failed-finalizable-${{ matrix.org }}

  aggregate-finalizable:
    needs: find-finalizable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      finalizable: ${{ steps.agg.outputs.finalizable }}
      active_count: ${{ steps.agg.outputs.active_count }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: finalizable-*
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: active-*
          merge-multiple: true
      - id: agg
        run: |
          cat finalizable-*.json | jq -s 'flatten' -c > all-finalizable.json
          echo "finalizable=$(cat all-finalizable.json)" >> "$GITHUB_OUTPUT"
          
          # Sum the active counts
          TOTAL_ACTIVE=0
          for f in active-*.json; do
            count=$(jq '.active' < "$f")
            TOTAL_ACTIVE=$((TOTAL_ACTIVE + count))
          done
          echo "active_count=$TOTAL_ACTIVE" >> "$GITHUB_OUTPUT"

  finalize:
    environment: provisioning
    needs: aggregate-finalizable
    if: needs.aggregate-finalizable.outputs.finalizable != '[]' && needs.aggregate-finalizable.outputs.finalizable != ''
    strategy:
      matrix:
        assignment: ${{ fromJSON(needs.aggregate-finalizable.outputs.finalizable) }}
      max-parallel: 4
      fail-fast: false
    concurrency:
      group: finalize-${{ matrix.assignment.org }}-${{ matrix.assignment.assignment_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: npm ci --omit=dev
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ matrix.assignment.org }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ matrix.assignment.org }}/pxl-classroom-control
          token: ${{ steps.token.outputs.token }}
          path: control

      - name: 1. Collect
        uses: ./collect
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ matrix.assignment.org }}
          assignment-id: ${{ matrix.assignment.assignment_id }}
          data-dir: control
          collection-type: deadline

      - name: 2. Lockdown
        uses: ./lockdown
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ matrix.assignment.org }}
          assignment-id: ${{ matrix.assignment.assignment_id }}
          data-dir: control

      # always(), for the reason Commit + push below already gives: lockdown
      # demotes permissions through the API before preserve runs, so those facts
      # are already true of the world. Dropping the archive because a later step
      # failed loses the frozen snapshot for every student who WAS locked.
      #
      # Preserve was the one step never given this treatment, and it cost a
      # whole cohort: an accepted org owner cannot be demoted, lockdown failed,
      # preserve was skipped, and nobody's work was archived that night - three
      # nights running, until find-finalizable hit its ceiling and gave up.
      # PXL-2TIN-DevOps-2627/test-opdracht, 2026-09-03.
      #
      # preserve.mjs already skips a student with no verified snapshot, so this
      # archives what was frozen and nothing else.
      - name: 3. Preserve
        if: always()
        id: preserve_step
        uses: ./preserve
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ matrix.assignment.org }}
          assignment-id: ${{ matrix.assignment.assignment_id }}
          data-dir: control

      - name: 4. Report
        if: always()
        uses: ./report
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ matrix.assignment.org }}
          assignment-id: ${{ matrix.assignment.assignment_id }}
          data-dir: control

      # The door this assignment leaves open otherwise.
      #
      # publish-assignment.yml sets INVITE_ENABLED=true and nothing ever set it
      # back, so every broker an organization has ever published still boots a
      # runner for any `pxl-accept:` issue - measured 2026-09-03, an exam five
      # days past its deadline was still accepting. The runner is free (public
      # repository) and serialised per login, so this is not about cost: after
      # the deadline the hub refuses every one of these as
      # `rejected:past-deadline`, which makes each boot guaranteed waste, and
      # the set of open doors grows by one per assignment forever.
      #
      # `if: always()` for the same reason as the commit below - lockdown has
      # already demoted permissions through the API by this point, so the
      # assignment is finished whether or not a later step failed.
      - name: 5. Close acceptance on the broker
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ matrix.assignment.org }}
          ASSIGNMENT_ID: ${{ matrix.assignment.assignment_id }}
          DATA_DIR: control
        run: node scripts/close-acceptance.mjs

      # always(): lockdown demotes permissions through the API before preserve
      # runs, so those facts are already true of the world - dropping them on a
      # preserve failure loses the frozen snapshot and the attempt counter that
      # find-finalizable uses to retry (and to stop retrying).
      - name: Commit + push
        if: always()
        env:
          ASSIGNMENT_ID: ${{ matrix.assignment.assignment_id }}
        run: |
          set -e
          git -C control config user.name "pxl-classroom[bot]"
          git -C control config user.email "pxl-classroom[bot]@users.noreply.github.com"
          # `git add a/ b/ c/` with ANY of them missing exits 128 and stages
          # NOTHING - not even the ones that matched. `|| true` then swallows
          # that, `diff --cached --quiet` is true, and the step exits 0 having
          # committed none of the finalisation it just computed. A control repo
          # scaffolded before a directory joined CONTROL_SCAFFOLD_DIRS has that
          # shape today. mkdir -p is a no-op when the directory is there.
          mkdir -p control/observations control/lockdowns control/reports
          git -C control add observations/ lockdowns/ reports/
          if git -C control diff --cached --quiet; then exit 0; fi
          git -C control commit -m "Finalize deadline for ${ASSIGNMENT_ID}"
          scripts/git-push-with-retry.sh control

      # Per assignment here, not just per organization: this matrix is over
      # assignments, and a lecturer with two cohorts finalizing the same night
      # needs to know which one did not.
      - name: Report this assignment's failure
        if: failure()
        continue-on-error: true
        uses: ./notify
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ matrix.assignment.org }}
          control-repo: pxl-classroom-control
          event-type: run-failed
          assignment-id: ${{ matrix.assignment.assignment_id }}
          details: |
            Finalizing this assignment did not complete. Lock-down, preservation
            or the report may be incomplete.

            It is re-queued automatically: an assignment counts as finalized only
            once every locked-down student has a verified preservation, so a leg
            that froze the cohort but failed to archive is retried on the next run
            and the nightly will not switch itself off while it is failing. A
            retried snapshot is frozen - a late commit can never replace an on-time
            submission.

            Act on this if it appears two nights running.

            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          dedup-key: run-failed-finalize-${{ matrix.assignment.org }}-${{ matrix.assignment.assignment_id }}

  check-idle:
    needs: [aggregate-finalizable, finalize]
    # result check required: a skipped aggregate job yields a null output,
    # and null == '0' is true under GitHub's numeric coercion.
    # A failed finalize leg still has outstanding work (typically an unarchived
    # submission). Disabling the workflow here would strand it forever, since
    # nothing would re-run to retry - so stay enabled and let tomorrow's cron
    # pick it up. It self-disables once the retry succeeds or hits the ceiling.
    #
    # `active_count` is summed over THE ORGS THIS RUN COVERED, so a dispatch
    # naming one org counts only that org's assignments. On 2026-08-26 a
    # single-org drill run (`-f org=PXLAutomation`, whose one published
    # assignment had just passed its deadline) reported active_count == 0 and
    # disabled the nightly for EVERY organization - four days before a live exam
    # in another org that this run never opened. Nothing re-enables it but a
    # publish, so that exam would simply never have been finalized.
    #
    # A scoped run may finalize, collect and report; it may not make a statement
    # about the hub as a whole.
    if: >-
      always() && needs.aggregate-finalizable.result == 'success'
      && needs.aggregate-finalizable.outputs.active_count == '0'
      && needs.finalize.result != 'failure'
      && (github.event_name != 'workflow_dispatch' || inputs.org == '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Disable Daily Activity Workflow
        run: |
          echo "No active assignments remain. Disabling daily-activity.yml to save minutes."
          gh workflow disable daily-activity.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
  trigger-dashboard:
    needs: [aggregate-finalizable, finalize]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'regenerate-dashboard.yml', ref: 'main'
            });
