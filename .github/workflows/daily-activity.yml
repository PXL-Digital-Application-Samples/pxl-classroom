name: Daily Activity & Deadline Check
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      org: { type: string }
      # Exercises the run-failed notification without waiting for a real
      # failure. Takes an organization LOGIN rather than a boolean, and fails
      # only that organization's collect leg, so the blast radius is one issue
      # in one control repo - the org you name.
      #
      # A boolean was the obvious shape and is the wrong one: it would fail
      # every leg of the matrix and post to every participating organization,
      # which is the accident this notification was reverted for once already
      # (1b0bcbc). Naming the target is what makes it safe to run against
      # `pxl-classroom-testbed` on a working day.
      simulate_failure_org:
        description: >-
          TESTING ONLY. Organization login whose collect step should fail on
          purpose, to prove the run-failed notification reaches its issue.
          Leave blank for normal operation.
        type: string
        default: ''

permissions:
  contents: read
jobs:
  find-orgs:
    uses: ./.github/workflows/_find-orgs.reusable.yml
    with:
      org: ${{ inputs.org }}

  disable-when-empty:
    needs: find-orgs
    # ONLY A RUN THAT COVERED EVERY ORG MAY DISABLE THE NIGHTLY. A dispatch
    # naming one org narrows find-orgs to that org, so a typo'd or
    # non-participating name yields `[]` here - which is a statement about the
    # input, not about the hub - and switching off the workflow for every
    # organization on the strength of it is a decision made on a truncated read.
    if: >-
      needs.find-orgs.outputs.orgs == '[]'
      && (github.event_name != 'workflow_dispatch' || inputs.org == '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Disable daily-activity (no participating orgs)
        run: |
          echo "No participating orgs registered. Disabling daily-activity.yml until next publish."
          gh api -H "X-GitHub-Api-Version: ${GITHUB_API_VERSION}" --method PUT \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-activity.yml/disable"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # lib/github-api-version.mjs, which YAML cannot import; the test
          # tests/github-api-version.test.mjs holds this equal to it.
          GITHUB_API_VERSION: "2026-03-10"

  collect:
    environment: provisioning
    needs: find-orgs
    if: needs.find-orgs.outputs.orgs != '[]'
    strategy:
      matrix:
        org: ${{ fromJSON(needs.find-orgs.outputs.orgs) }}
      max-parallel: 4
      fail-fast: false
    concurrency:
      group: collect-${{ matrix.org }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Tried again on a registry blip (./install): one ECONNRESET on
      # 2026-10-20 cost this org a night's collect. Three minutes: a collect
      # has taken up to 5m42s, and both fit inside the job's ten.
      - uses: ./install
        with:
          retry-budget-minutes: "3"
          give-up-note: "this organization is read again by the next nightly."
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}
          # The control repo only, and only what the checkout and the push
          # need: ./collect and ./notify mint their own (lib/app-token-scopes.mjs).
          repositories: pxl-classroom-control
          permission-contents: write
      # `id: control`: the steps below that run past an earlier failure
      # (`always()`) read this checkout, so they run only when it happened -
      # without it they failed again over a missing directory, burying why.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: control
        with:
          repository: ${{ matrix.org }}/pxl-classroom-control
          token: ${{ steps.token.outputs.token }}
          path: control
      # Placed AFTER both checkouts, so the failure it stages is the realistic
      # one: the job is fully set up and something inside it dies. A failure
      # before the hub checkout cannot be reported at all, and pretending to
      # test that case would prove the opposite of what it claims.
      - name: Fail on purpose (simulate_failure_org)
        if: inputs.simulate_failure_org != '' && matrix.org == inputs.simulate_failure_org
        env:
          ORG: ${{ matrix.org }}
        run: |
          echo "simulate_failure_org names this organization; failing deliberately." >&2
          echo "Nothing has been written to ${ORG}. This is a notification test." >&2
          exit 1

      - uses: ./collect
        id: collect_action
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ matrix.org }}
          assignment-id: ''
          collection-type: scheduled
          data-dir: control

      # Fold GitHub-VERIFIED claims into the roster, so a lecturer has no step
      # to find. Only the unambiguous ones: a typed address, a conflict or an
      # address two accounts claim is a decision, and it is left for a human.
      # Here rather than in its own workflow because this job already has the
      # control repo checked out, is serialised per org, and already commits -
      # so it costs no Actions minutes of its own.
      - name: Link verified claims into the roster
        if: always() && steps.control.outcome == 'success'
        run: node scripts/link-claims.mjs --data-dir control

      - name: Commit + push to control repo
        if: always() && steps.control.outcome == 'success'
        run: |
          set -e
          git -C control config user.name "pxl-classroom[bot]"
          git -C control config user.email "pxl-classroom[bot]@users.noreply.github.com"
          mkdir -p control/observations control/students
          git -C control add observations/ students/
          if git -C control diff --cached --quiet; then exit 0; fi
          git -C control commit -m "Collect activity"
          scripts/git-push-with-retry.sh control

      # STUDENT REPOSITORIES WITH NO RECORD. An acceptance creates the
      # repository first and records it last; when that record is lost the
      # student can work and is on no list, so nothing here collects, locks,
      # archives or grades them (lib/unrecorded-repos.mjs - measured on
      # PXL-SNB-Security-Expert2627, one student, two days). The acceptance
      # notifies when its own push fails; this asks from the other side, in the
      # job that already has the org's records checked out, for one repository
      # listing a night.
      #
      # REPORT ONLY, and advisory: `continue-on-error` on all three, so it can
      # never fail the collect leg or skip another organization's work. Its own
      # token, metadata only: it lists the organization's repositories, which
      # the control-repo token above cannot (lib/app-token-scopes.mjs).
      - name: Token for listing the organization's repositories
        id: unrecorded_token
        if: always()
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}
          permission-metadata: read
          # A team-shaped finding is asked who can open it and what is in it,
          # so an empty leftover is not reported (lib/unrecorded-repos.mjs).
          permission-contents: read
          permission-administration: read

      - name: Find student repositories with no record
        id: unrecorded
        if: always() && steps.control.outcome == 'success' && steps.unrecorded_token.outputs.token != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.unrecorded_token.outputs.token }}
          ORG: ${{ matrix.org }}
        run: node scripts/find-unrecorded-repos.mjs control "$ORG"

      - name: Tell the lecturer about repositories with no record
        if: always() && steps.unrecorded.outputs.count != '' && steps.unrecorded.outputs.count != '0'
        continue-on-error: true
        uses: ./notify
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ matrix.org }}
          control-repo: pxl-classroom-control
          event-type: provisioning-failed
          assignment-id: unrecorded-repositories
          details: ${{ steps.unrecorded.outputs.details }}
          dedup-key: ${{ steps.unrecorded.outputs.dedup }}

      # ACCEPTANCE ATTEMPTS THAT GOT NO ANSWER. When GitHub drops the event, a
      # run never starts, or one dies before it records anything, nothing is
      # written anywhere and the only trace is the student's issue on the
      # public broker (lib/unanswered-attempts.mjs). Report only, advisory, its
      # own token: it reads issues, which neither token above can.
      - name: Token for reading acceptance attempts
        id: unanswered_token
        if: always()
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}
          permission-issues: read

      - name: Find acceptance attempts that got no answer
        id: unanswered
        if: always() && steps.control.outcome == 'success' && steps.unanswered_token.outputs.token != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.unanswered_token.outputs.token }}
          ORG: ${{ matrix.org }}
        run: node scripts/find-unanswered-attempts.mjs control "$ORG"

      - name: Tell the lecturer about attempts that got no answer
        if: always() && steps.unanswered.outputs.count != '' && steps.unanswered.outputs.count != '0'
        continue-on-error: true
        uses: ./notify
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ matrix.org }}
          control-repo: pxl-classroom-control
          event-type: provisioning-failed
          assignment-id: unanswered-attempts
          details: ${{ steps.unanswered.outputs.details }}
          dedup-key: ${{ steps.unanswered.outputs.dedup }}

      # Reported from INSIDE the job that knows which organization it is.
      #
      # The first version of this was a separate job gated on `failure()`, which
      # at job level is true when ANY dependency failed - and
      # `needs.collect.result` is the aggregate of this whole matrix. One
      # organization's leg failing would have mailed a "your nightly did not
      # finish" comment to all thirteen, twelve of them wrongly. Reverted in
      # 1b0bcbc; an issue comment mails every watcher, and a false alarm nobody
      # can act on is how the channel RUNBOOK §2.1 calls a daily checklist stops
      # being read.
      #
      # A step sees only its own job, so this reports exactly one organization.
      # It covers every failure from the runner starting onwards, including a
      # control-repo checkout that could not clone. What it cannot cover is the
      # HUB checkout failing - `./notify` lives in the repository that did not
      # check out - and that case is still visible only on the Actions tab.
      #
      # continue-on-error: the collection failure is the thing to report, and
      # failing to report it must not replace that signal with a different one.
      - name: Report this org's failure
        if: failure()
        continue-on-error: true
        uses: ./notify
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ matrix.org }}
          control-repo: pxl-classroom-control
          event-type: run-failed
          assignment-id: nightly-collect
          details: |
            Tonight's collection did not finish for this organization. Observations
            may be incomplete, and the dashboard will be stale until a run succeeds.

            Nothing is lost: collection is re-run every night, and a deadline that
            passed in the meantime is still enforced from the commit timestamps
            rather than from when the collector looked.

            Act on this if it appears two nights running.

            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          dedup-key: run-failed-collect-${{ matrix.org }}

  find-finalizable:
    environment: provisioning
    needs: [find-orgs, collect]
    if: always() && needs.find-orgs.outputs.orgs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        org: ${{ fromJSON(needs.find-orgs.outputs.orgs) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./install
        with:
          retry-budget-minutes: "4"
          give-up-note: "this organization's assignments are planned again by the next nightly."
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}
          # Reads the control repo and nothing else (lib/app-token-scopes.mjs).
          repositories: pxl-classroom-control
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.org }}/pxl-classroom-control
          token: ${{ steps.token.outputs.token }}
          path: control
      - id: find
        env:
          ORG: ${{ matrix.org }}
        run: |
          node scripts/find-finalizable.mjs control "$ORG" > "finalizable-${ORG}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finalizable-${{ matrix.org }}
          path: finalizable-${{ matrix.org }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: active-${{ matrix.org }}
          path: active-${{ matrix.org }}.json

      # Per organization, for the reason given in the collect job above.
      - name: Report this org's failure
        if: failure()
        continue-on-error: true
        uses: ./notify
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ matrix.org }}
          control-repo: pxl-classroom-control
          event-type: run-failed
          assignment-id: nightly-finalizable-scan
          details: |
            The nightly could not work out which of this organization's assignments
            are ready to finalize, so none of them were locked down or preserved
            tonight.

            An assignment past its deadline stays queued and is retried on the next
            run; the submission is reconstructed from commits made before the
            deadline either way, so a night's delay does not change anyone's grade.

            Act on this if it appears two nights running.

            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          dedup-key: run-failed-finalizable-${{ matrix.org }}

  aggregate-finalizable:
    needs: [find-orgs, find-finalizable]
    # ALWAYS, when the scan ran at all. Without it, one organization's failed
    # collect leg skipped this job - and finalize and check-idle after it - for
    # EVERY organization, because a failure skips everything downstream through
    # the whole needs chain, not just the job that needs it directly. It did on
    # 2026-09-16 and 2026-09-17, leaving two assignments unfinalized. Running on
    # means a failed leg's organization is merely absent from the plan tonight;
    # `complete` (scripts/aggregate-finalizable.mjs) is what stops that absence
    # reading as "nothing active" to check-idle.
    if: always() && (needs.find-finalizable.result == 'success' || needs.find-finalizable.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      finalizable: ${{ steps.agg.outputs.finalizable }}
      active_count: ${{ steps.agg.outputs.active_count }}
      complete: ${{ steps.agg.outputs.complete }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: finalizable-*
          merge-multiple: true
          path: scan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: active-*
          merge-multiple: true
          path: scan
      - id: agg
        env:
          FIND_RESULT: ${{ needs.find-finalizable.result }}
          EXPECTED_ORGS: ${{ needs.find-orgs.outputs.orgs }}
        run: node scripts/aggregate-finalizable.mjs scan

  finalize:
    environment: provisioning
    needs: aggregate-finalizable
    # always() for the same reason as aggregate-finalizable: without it a failed
    # collect leg anywhere upstream skips this job for every organization, even
    # when the aggregate it needs succeeded. The explicit result check is what
    # keeps a failed or skipped aggregate from finalizing on an empty output.
    if: >-
      always() && needs.aggregate-finalizable.result == 'success'
      && needs.aggregate-finalizable.outputs.finalizable != '[]'
      && needs.aggregate-finalizable.outputs.finalizable != ''
    strategy:
      matrix:
        assignment: ${{ fromJSON(needs.aggregate-finalizable.outputs.finalizable) }}
      max-parallel: 4
      fail-fast: false
    concurrency:
      group: finalize-${{ matrix.assignment.org }}-${{ matrix.assignment.assignment_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A finalize that cannot install locks and preserves nothing tonight.
      - uses: ./install
        with:
          retry-budget-minutes: "4"
          give-up-note: "this assignment is finalized by the next nightly."
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ matrix.assignment.org }}
          # The control repo push, closing the broker (Variables, Secrets) and
          # reading grading results (Checks). Every repository, because the
          # broker and the student repositories come from the records. The
          # composite actions mint their own (lib/app-token-scopes.mjs). The
          # run log warns about permission-actions-variables; it is applied.
          permission-actions-variables: write
          permission-checks: read
          permission-contents: write
          permission-metadata: read
          permission-secrets: write
      # `id: control`, read by every step below that runs past an earlier
      # failure: with no checkout there is nothing to lock, archive or commit,
      # and each failed again over a missing directory, burying why.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: control
        with:
          repository: ${{ matrix.assignment.org }}/pxl-classroom-control
          token: ${{ steps.token.outputs.token }}
          path: control

      # The commit this job checked out, before step 2b commits on top of it:
      # what the scores step compares a lecturer's save against.
      - name: Where the checkout starts
        id: start
        if: steps.control.outcome == 'success'
        run: echo "sha=$(git -C control rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A BROKER OWED A CLOSE AND NOTHING ELSE (review 2026-10-16, R7-4,
      # R7-11; scripts/find-finalizable.mjs `close_only`): every step but 5 and
      # the commit skips it. A whole finalize queued for one is how `4ee1236`
      # reached every assignment ever moved after its lock.
      - name: 1. Collect
        if: matrix.assignment.close_only != true
        uses: ./collect
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ matrix.assignment.org }}
          assignment-id: ${{ matrix.assignment.assignment_id }}
          data-dir: control
          collection-type: deadline

      # Unless cancelled, not only on success. Lockdown reads nothing 1. Collect
      # writes - the assignment, repository records, teams, overrides, its own
      # prior record, and each student's state from the API - so a collect that
      # failed (every repository erroring, say) is no reason to leave the cohort
      # able to push past the deadline. It had no condition from Wave 8 until
      # 2026-09-17, when preserve had long since been given one for the same
      # cascade. `!cancelled()` rather than always(): a run somebody cancels by
      # hand must not go on to lock a cohort.
      - name: 2. Lockdown
        id: lockdown
        if: ${{ !cancelled() && steps.control.outcome == 'success' && matrix.assignment.close_only != true }}
        uses: ./lockdown
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ matrix.assignment.org }}
          assignment-id: ${{ matrix.assignment.assignment_id }}
          data-dir: control

      # THE LOCK RECORD, COMMITTED THE MOMENT IT IS WRITTEN (review 2026-10-16,
      # R7-31). Committed with everything else after preserve, report and the
      # scores, it was invisible for minutes after the lock, and a lecturer who
      # moved the deadline later in those minutes published over a branch with
      # no lock record: the publish let go of the stop, and the record then
      # landed saying the cohort was locked under the old deadline. Lockdown
      # asks the deadline again just before it writes (lockdown.mjs), and the
      # publish asks GitHub for the record before it releases anything
      # (release-stale-stop.mjs), so from here they agree. Allowed to fail:
      # the commit below carries the record too. Autostash, because collect's
      # observations are still in the checkout.
      - name: 2b. Commit the lock record
        if: ${{ !cancelled() && steps.control.outcome == 'success' && matrix.assignment.close_only != true && steps.lockdown.outputs.outcome != 'deleted' }}
        continue-on-error: true
        env:
          ASSIGNMENT_ID: ${{ matrix.assignment.assignment_id }}
        run: |
          set -e
          DIR="lockdowns/${ASSIGNMENT_ID}"
          if [ ! -f "control/${DIR}/lockdown-record.json" ]; then exit 0; fi
          # Deleted meanwhile (R7-17): the commit below says so; nothing here.
          on=0
          scripts/assignment-on-branch.sh control "$ASSIGNMENT_ID" || on=$?
          if [ "$on" = 1 ]; then exit 0; fi
          git -C control config user.name "pxl-classroom[bot]"
          git -C control config user.email "pxl-classroom[bot]@users.noreply.github.com"
          mkdir -p "control/${DIR}"
          # A removed reopen record (R7-29) is staged too: a pathspec stages removals.
          git -C control add -- "${DIR}/"
          if git -C control diff --cached --quiet; then exit 0; fi
          git -C control commit -q -m "Lock record for ${ASSIGNMENT_ID}"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=rebase.autoStash GIT_CONFIG_VALUE_0=true scripts/git-push-with-retry.sh control

      # always(), for the reason Commit + push below already gives: lockdown
      # demotes permissions through the API before preserve runs, so those facts
      # are already true of the world. Dropping the archive because a later step
      # failed loses the frozen snapshot for every student who WAS locked.
      #
      # Preserve was the one step never given this treatment, and it cost a
      # whole cohort: an accepted org owner cannot be demoted, lockdown failed,
      # preserve was skipped, and nobody's work was archived that night - three
      # nights running, until find-finalizable hit its ceiling and gave up.
      # PXL-2TIN-DevOps-2627/test-opdracht, 2026-09-03.
      #
      # preserve.mjs already skips a student with no verified snapshot, so this
      # archives what was frozen and nothing else.
      #
      # Steps 3 to 6 skip an assignment lockdown found DELETED while this ran
      # (review 2026-10-16, R7-26): preserving made an archive for an
      # assignment nobody has, and the steps after it went red on its absence.
      - name: 3. Preserve
        if: always() && steps.control.outcome == 'success' && matrix.assignment.close_only != true && steps.lockdown.outputs.outcome != 'deleted'
        id: preserve_step
        uses: ./preserve
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ matrix.assignment.org }}
          assignment-id: ${{ matrix.assignment.assignment_id }}
          data-dir: control

      - name: 4. Report
        if: always() && steps.control.outcome == 'success' && matrix.assignment.close_only != true && steps.lockdown.outputs.outcome != 'deleted'
        uses: ./report
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ matrix.assignment.org }}
          assignment-id: ${{ matrix.assignment.assignment_id }}
          data-dir: control

      # The door this assignment leaves open otherwise.
      #
      # publish-assignment.yml sets INVITE_ENABLED=true and nothing ever set it
      # back, so every broker an organization has ever published still boots a
      # runner for any `pxl-accept:` issue - measured 2026-09-03, an exam five
      # days past its deadline was still accepting. The runner is free (public
      # repository) and serialised per login, so this is not about cost: after
      # the deadline the hub refuses every one of these as
      # `rejected:past-deadline`, which makes each boot guaranteed waste, and
      # the set of open doors grows by one per assignment forever.
      #
      # `if: always()` for the same reason as the commit below - lockdown has
      # already demoted permissions through the API by this point, so the
      # assignment is finished whether or not a later step failed.
      - name: 5. Close acceptance on the broker
        if: always() && steps.control.outcome == 'success' && steps.lockdown.outputs.outcome != 'deleted'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ matrix.assignment.org }}
          ASSIGNMENT_ID: ${{ matrix.assignment.assignment_id }}
          DATA_DIR: control
        run: node scripts/close-acceptance.mjs

      # 6. THE SCORES, which until now nobody read without pressing a button.
      #
      # Here and nowhere else: the deadline has passed, so the submission is
      # decided - the preserved commit, or the hand-in the marker names bounded
      # by each student's own effective deadline - and this job already holds
      # the control repository and already commits it. One Checks read per
      # student inside a job that is running anyway; no new trigger, no new
      # credential, no idle minutes.
      #
      # AFTER the report, because it reads the report's rows to know which
      # commit each student's score belongs to. Before the commit below, so the
      # summary travels with the rest of the finalisation.
      #
      # `continue-on-error` AND the script's own refusal to exit non-zero, which
      # is belt and braces on purpose: by this point the cohort is locked and
      # their submissions are in the archive. Failing the leg over a score would
      # re-queue all of that to fix something a lecturer can read with one
      # button, and every retry burns an attempt from the ceiling that stops
      # find-finalizable looping.
      # ITS OWN TOKEN, allowed to fail. A hand-in cap counts from the push run
      # history, which needs Actions (read) - a permission no other finalize
      # step asks for. Were it on the finalize token above, an installation
      # that never approved Actions would fail that mint and skip lockdown and
      # preservation for the whole organization. Here a failed mint skips only
      # this read, which is already non-fatal and says why.
      - name: 6a. Token for reading scores
        id: gradetoken
        if: always() && matrix.assignment.close_only != true && steps.lockdown.outputs.outcome != 'deleted'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ matrix.assignment.org }}
          # Commits and check runs in the student repositories, and the push
          # run history a hand-in cap counts from (lib/app-token-scopes.mjs).
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-metadata: read

      # Falls back to the finalize token when 6a could not be minted: an
      # assignment with no hand-in commit message is read from its check runs
      # as before, and one WITH a hand-in message - capped or not, since every
      # hand-in is dated by its push - reads the run history, is refused it
      # (HTTP 403), reports that as a permission and writes nothing: never a
      # hand-in taken from the branch alone.
      - name: 6. Read autograding scores
        if: always() && steps.control.outcome == 'success' && matrix.assignment.close_only != true && steps.lockdown.outputs.outcome != 'deleted'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.gradetoken.outputs.token || steps.token.outputs.token }}
          ASSIGNMENT_ID: ${{ matrix.assignment.assignment_id }}
          DATA_DIR: control
        run: node scripts/grade-at-deadline.mjs

      # always(): lockdown demotes permissions through the API before preserve
      # runs, so those facts are already true of the world - dropping them on a
      # preserve failure loses the frozen snapshot and the attempt counter that
      # find-finalizable uses to retry (and to stop retrying).
      #
      # THIS LEG COMMITS NO REPORT - not reports/dashboard.json, and not
      # reports/<id>.json or .csv either. Every one of them is DERIVED: report.mjs
      # computes it from observations/, lockdowns/, acceptances/, overrides/ and
      # the rest, all of which this commit carries, and stamps `generated_at`, so
      # two runs over the same sources still write different bytes.
      #
      # regenerate-dashboard.yml owns all of reports/. It runs the same
      # report.mjs over every published or closed assignment, it is serialised
      # per ORGANIZATION (`group: dashboard-<org>`), and trigger-dashboard
      # dispatches it after this job on `always()` - so it rebuilds this
      # assignment's report from the sources pushed here. A second git writer
      # of the same derived file collides with it whenever the two overlap:
      #  - 2026-09-08, two assignments finalizing at once both rewrote
      #    dashboard.json, and the second leg died rebasing into a conflict;
      #  - 2026-09-27, the sentinel fired twice, the second finalize (serialised
      #    behind the first by its concurrency group) ran while
      #    regenerate-dashboard committed six times, and its push conflicted on
      #    reports/<id>.json. Lock, archive and report were all right; the
      #    deadline still went red.
      # step 6 still reads the report computed above from disk.
      #
      # Discarded from the WORKTREE as well as never staged: `git pull --rebase`
      # refuses to run over a modified tracked file, and a new untracked report
      # the remote also added stops it too ("would be overwritten").
      #
      # `git add a/ b/` with ANY of them missing exits 128 and stages NOTHING,
      # and `|| true` would turn that into a green "no changes" - so mkdir -p
      # first.
      #
      # THE SCORES ARE NOT IN THIS COMMIT (review 2026-10-15, R6-8). A
      # lecturer's Read all scores again at the deadline writes
      # grading/<id>/summary.json too, and one conflict on it failed the push of
      # the lock record, the observations and the preservation with it: the
      # deadline red, none of it on record. They are set aside here and
      # committed by the next step, which yields to a save made meanwhile.
      - name: Commit + push
        id: commit
        if: always() && steps.control.outcome == 'success'
        env:
          ASSIGNMENT_ID: ${{ matrix.assignment.assignment_id }}
          LOCKDOWN_OUTCOME: ${{ steps.lockdown.outputs.outcome }}
        run: |
          set -e
          git -C control config user.name "pxl-classroom[bot]"
          git -C control config user.email "pxl-classroom[bot]@users.noreply.github.com"
          rm -rf "$RUNNER_TEMP/scores"
          mkdir -p "$RUNNER_TEMP/scores"
          if [ -d control/grading ]; then cp -R control/grading/. "$RUNNER_TEMP/scores/"; fi
          git -C control restore --staged --worktree -- grading/ 2>/dev/null || true
          git -C control clean -fdq -- grading/
          # A pathspec that matches nothing tracked is not a failure here.
          git -C control restore --staged --worktree -- reports/ 2>/dev/null || true
          git -C control clean -fdq -- reports/
          # DELETED WHILE THIS RAN (review 2026-10-16, R7-17): committing would
          # put back the directories the delete removed, for an assignment
          # nobody has any more. Lockdown's `deleted` settles it; otherwise
          # the branch is asked, not the checkout, retried (R7-26), and a fetch
          # that never answers commits as before. Gone, the checkout's changes
          # are discarded and `deleted` said, so the scores step does not pull
          # over them for an assignment that no longer exists (R7-39).
          on=0
          if [ "$LOCKDOWN_OUTCOME" = deleted ]; then on=1; else scripts/assignment-on-branch.sh control "$ASSIGNMENT_ID" || on=$?; fi
          if [ "$on" = 2 ]; then echo "::warning::Could not ask GitHub whether ${ASSIGNMENT_ID} still exists, so it is committed as before."; fi
          if [ "$on" = 1 ]; then
            echo "::notice::${ASSIGNMENT_ID} was deleted while this ran, so nothing of it is committed."
            git -C control reset -q --hard HEAD
            git -C control clean -fdq
            echo "deleted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p control/observations control/lockdowns
          git -C control add observations/ lockdowns/
          if git -C control diff --cached --quiet; then exit 0; fi
          git -C control commit -m "Finalize deadline for ${ASSIGNMENT_ID}"
          scripts/git-push-with-retry.sh control

      # The scores read at the deadline, in a commit of their own. A summary
      # someone saved since this job checked out is THEIRS to keep: a
      # lecturer's read of the same runs, made with overrides this checkout may
      # not have. So is any change to this assignment's overrides: a read made
      # without a decision would be written over it. Kept, and said; reading
      # again on the Grading tab reads them with everything. "Since this job
      # checked out" is the checkout's own commit (`steps.start`), not the
      # branch after the lock record's commit, which may already carry a save.
      - name: Commit + push the scores
        if: always() && steps.commit.outcome == 'success' && steps.commit.outputs.deleted != 'true'
        env:
          ASSIGNMENT_ID: ${{ matrix.assignment.assignment_id }}
          START: ${{ steps.start.outputs.sha }}
        run: |
          set -e
          SUMMARY="grading/${ASSIGNMENT_ID}/summary.json"
          if [ ! -f "$RUNNER_TEMP/scores/${ASSIGNMENT_ID}/summary.json" ]; then exit 0; fi
          git -C control pull -q --rebase
          if ! git -C control diff --quiet "$START" HEAD -- "$SUMMARY" "overrides/${ASSIGNMENT_ID}/"; then
            echo "::notice::The scores or a grading decision for ${ASSIGNMENT_ID} were saved while this ran, so those are kept and this reading is not written. Read all scores again on the Grading tab to read them with everything."
            exit 0
          fi
          mkdir -p "control/grading/${ASSIGNMENT_ID}"
          cp "$RUNNER_TEMP/scores/${ASSIGNMENT_ID}/summary.json" "control/${SUMMARY}"
          git -C control add -- "$SUMMARY"
          if git -C control diff --cached --quiet; then exit 0; fi
          git -C control commit -m "Scores at the deadline for ${ASSIGNMENT_ID}"
          scripts/git-push-with-retry.sh control

      # Per assignment here, not just per organization: this matrix is over
      # assignments, and a lecturer with two cohorts finalizing the same night
      # needs to know which one did not.
      - name: Report this assignment's failure
        if: failure()
        continue-on-error: true
        uses: ./notify
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ matrix.assignment.org }}
          control-repo: pxl-classroom-control
          event-type: run-failed
          assignment-id: ${{ matrix.assignment.assignment_id }}
          details: |
            Finalizing this assignment did not complete. Lock-down, preservation
            or the report may be incomplete.

            It is re-queued automatically: an assignment counts as finalized only
            once every locked-down student has a verified preservation, so a leg
            that froze the cohort but failed to archive is retried on the next run
            and the nightly will not switch itself off while it is failing. A
            retried snapshot is frozen - a late commit can never replace an on-time
            submission.

            Act on this if it appears two nights running.

            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          dedup-key: run-failed-finalize-${{ matrix.assignment.org }}-${{ matrix.assignment.assignment_id }}

  check-idle:
    needs: [aggregate-finalizable, finalize]
    # result check required: a skipped aggregate job yields a null output,
    # and null == '0' is true under GitHub's numeric coercion.
    # A failed finalize leg still has outstanding work (typically an unarchived
    # submission). Disabling the workflow here would strand it forever, since
    # nothing would re-run to retry - so stay enabled and let tomorrow's cron
    # pick it up. It self-disables once the retry succeeds or hits the ceiling.
    #
    # `active_count` is summed over THE ORGS THIS RUN COVERED, so a dispatch
    # naming one org counts only that org's assignments. On 2026-08-26 a
    # single-org drill run (`-f org=PXLAutomation`, whose one published
    # assignment had just passed its deadline) reported active_count == 0 and
    # disabled the nightly for EVERY organization - four days before a live exam
    # in another org that this run never opened. Nothing re-enables it but a
    # publish, so that exam would simply never have been finalized.
    #
    # A scoped run may finalize, collect and report; it may not make a statement
    # about the hub as a whole.
    #
    # Nor may an INCOMPLETE one. aggregate-finalizable runs even when a scan leg
    # failed, and that organization's assignments are then missing from
    # active_count - so a zero may be a failure, not an idle hub. `complete`
    # is true only when every organization reported a count.
    if: >-
      always() && needs.aggregate-finalizable.result == 'success'
      && needs.aggregate-finalizable.outputs.complete == 'true'
      && needs.aggregate-finalizable.outputs.active_count == '0'
      && needs.finalize.result != 'failure'
      && (github.event_name != 'workflow_dispatch' || inputs.org == '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Disable Daily Activity Workflow
        run: |
          echo "No active assignments remain. Disabling daily-activity.yml to save minutes."
          gh api -H "X-GitHub-Api-Version: ${GITHUB_API_VERSION}" --method PUT \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-activity.yml/disable"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # lib/github-api-version.mjs, which YAML cannot import; the test
          # tests/github-api-version.test.mjs holds this equal to it.
          GITHUB_API_VERSION: "2026-03-10"
  trigger-dashboard:
    needs: [aggregate-finalizable, finalize]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # lib/github-api-version.mjs, which YAML cannot import; the test
          # tests/github-api-version.test.mjs holds this equal to it.
          GITHUB_API_VERSION: "2026-03-10"
        with:
          script: |
            github.hook.before('request', (o) => { o.headers = { ...o.headers, 'x-github-api-version': process.env.GITHUB_API_VERSION }; });
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'regenerate-dashboard.yml', ref: 'main'
            });
