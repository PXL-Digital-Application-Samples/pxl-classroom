name: Deploy frontend to Pages

on:
  push:
    branches: ["main"]
    # EVERY PATH THE BUNDLE READS BELONGS HERE, or a change ships to main and
    # never reaches a student. `frontend/src/lib/claim.js` imports
    # `acceptance/claim-keys.json` at build time, and that path was missing:
    # minting the hub's claim keypair touched only that file, so no deploy fired
    # and the live SPA kept serving a bundle whose key list was empty - which
    # renders "claiming is not set up for this course yet" on a course where it
    # very much is. A rotation would have failed the same way, silently, with
    # nothing red anywhere.
    paths:
      - 'frontend/**'
      - 'lib/**'
      - 'schemas/**'
      - 'acceptance/claim-keys.json'
      - 'deployment.yml'
      # The in-app help. `prebuild` runs scripts/build-manual.mjs over MANUAL.md
      # into frontend/src/generated/manual.json, which the bundle imports - so
      # this file is a BUILD INPUT, not documentation, and it was missing here
      # for the same reason claim-keys.json was. A help-text fix landed on main
      # and never reached a lecturer, with nothing red anywhere; it only looked
      # deployed because every edit so far happened to travel with a
      # frontend/** change.
      - 'MANUAL.md'
      - 'scripts/build-manual.mjs'
      - '.github/workflows/deploy-frontend.yml'
      # The two scripts this workflow RUNS, which is the same rule one level
      # out: they decide what the published artifact contains, so a change to
      # either has to be able to reach the site. Removing the republished
      # legacy `public/teams` cohort lists landed on main and would have sat
      # there until some unrelated frontend change happened to fire a deploy;
      # so would a fix to the privacy gate itself. Named individually rather
      # than `scripts/**`, which would deploy on every unrelated script change.
      - 'scripts/fetch-pages-data.mjs'
      - 'pages/scan.mjs'

  # A RELEASE IS A BUILD INPUT, and it was missing here for the same reason
  # `claim-keys.json` and `MANUAL.md` were missing above: the bundle reads
  # something this list did not name. "Resolve build identity" below stamps the
  # version from `git describe --tags`, so what the app says about itself is
  # decided by which tags existed AT BUILD TIME - and a tag is created after the
  # commit it names has already deployed.
  #
  # Measured on 2026-09-18: the deploy for `affe250` finished at 01:22:17Z and
  # v1.3.0 was tagged at 01:34:43Z, so the live site advertised `v1.2.1
  # (affe250)` - a version the release notes say is two days and 53 commits old.
  # Nothing was red, and nothing would have corrected it until some unrelated
  # frontend change happened to fire a deploy, at which point the number would
  # jump without anybody touching the release.
  #
  # `release: [published]` rather than a tag push: the path filter above applies
  # to push events, so `tags:` in the same block would be filtered by it.
  #
  # IT DOES NOT FIRE FOR A RELEASE CUT BY `release.yml`, AND CANNOT.
  # semantic-release authenticates with `secrets.GITHUB_TOKEN`, and GitHub
  # deliberately starts no workflow run from an event that token raises.
  # Measured 2026-09-22: v1.3.1 was published at 16:56:31Z, no deploy run was
  # created, and the live site kept advertising v1.3.0 - the very symptom the
  # trigger was added for. `release.yml` now dispatches this workflow itself,
  # which is an ordinary `workflow_dispatch` and does start a run.
  #
  # This trigger stays for the case it CAN serve: a release cut by hand, or by
  # anything authenticating as a person rather than as the workflow token.
  # Both paths are idempotent - a redundant build republishes the same bytes.
  release:
    types: [published]

  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    environment: provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags, so the build can name the release it came from. A default
          # checkout fetches none, and `git describe` would then report nothing
          # on every deploy - a version that is silently always absent is worse
          # than no version field at all, because the field looks like it works.
          fetch-tags: true
          fetch-depth: 0

      - name: Resolve build identity
        id: build_id
        run: |
          set -e
          # The most recent tag reachable from this commit, or empty. Empty is a
          # legitimate answer before the first release, and build-info.js
          # renders the SHA alone rather than inventing a number.
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION:-(untagged)} at ${GITHUB_SHA}"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # The SPA imports lib/*.mjs from the repo root; those modules resolve
      # their packages (yaml) from the root node_modules.
      - name: Install root dependencies
        run: npm ci --omit=dev

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Copy schemas
        run: |
          mkdir -p frontend/public/schemas
          cp schemas/*.schema.json frontend/public/schemas/

      - name: Fetch participating orgs definition
        run: |
          git fetch origin participating-orgs:participating-orgs || true
          git show participating-orgs:participating-orgs.yml > participating-orgs.yml || true

      - name: Fetch public pages data from org control repos
        run: node scripts/fetch-pages-data.mjs
        env:
          PXL_APP_CLIENT_ID: ${{ secrets.PXL_APP_CLIENT_ID }}
          PXL_APP_PRIVATE_KEY: ${{ secrets.PXL_APP_PRIVATE_KEY }}

      - name: Build
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          # What is running, readable from the app itself. Answering "which
          # build were you on" used to mean listing deploy runs and matching
          # headSha by hand, which a lecturer cannot do at all.
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_VERSION: ${{ steps.build_id.outputs.version }}
          # The SECOND device-flow proxy now, not the first. The PXL-owned Worker
          # is primary and comes from deployment.yml, which is why there is no
          # VITE_CORS_PROXY_FALLBACK_URL here any more - auth.js stopped reading
          # it, and a secret the build passes that nothing reads is a value
          # people keep maintaining for no effect. See deployment.yml.
          VITE_CORS_PROXY_URL: ${{ secrets.VITE_CORS_PROXY_URL }}

      # THE GATE AT THE MOMENT OF PUBLICATION, which did not exist.
      #
      # pages/scan.mjs was invoked from exactly one place - pages/action.yml -
      # which runs when an ORG's control repo regenerates its own `public/`. This
      # workflow is what actually puts bytes on a world-readable site, and it ran
      # no scan at all: `scripts/fetch-pages-data.mjs` copies `public/i/*.json`
      # and `public/teams/*.json` verbatim out of twelve control repos into
      # `frontend/public/data`, and whatever is in them ships. Anything that
      # reached a control repo's `public/` by another route - hand-edited, left
      # by an older generator, or from a run where the gate was skipped - was
      # published unchecked.
      #
      # Scoped to `dist/data` rather than all of `dist`, and that is deliberate
      # rather than timid: `dist/data` is the aggregated, externally-sourced half
      # and the only part of the artifact this repo does not author. The rest is
      # the SPA bundle and `schemas/*.schema.json`, which legitimately and
      # necessarily contain `"student_number":` - scanning them would fail every
      # deploy on the field-name rules and the gate would be turned off within a
      # week, which is how a check stops being read.
      - name: Privacy scan the published data
        run: node pages/scan.mjs frontend/dist/data

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
