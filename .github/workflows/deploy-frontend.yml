name: Deploy frontend to Pages

on:
  push:
    branches: ["main"]
    # EVERY PATH THE BUNDLE READS BELONGS HERE, or a change ships to main and
    # never reaches a student. `frontend/src/lib/claim.js` imports
    # `acceptance/claim-keys.json` at build time, and that path was missing:
    # minting the hub's claim keypair touched only that file, so no deploy fired
    # and the live SPA kept serving a bundle whose key list was empty - which
    # renders "claiming is not set up for this course yet" on a course where it
    # very much is. A rotation would have failed the same way, silently, with
    # nothing red anywhere.
    paths:
      - 'frontend/**'
      - 'lib/**'
      - 'schemas/**'
      - 'acceptance/claim-keys.json'
      - 'deployment.yml'
      # The in-app help. `prebuild` runs scripts/build-manual.mjs over MANUAL.md
      # into frontend/src/generated/manual.json, which the bundle imports - so
      # this file is a BUILD INPUT, not documentation, and it was missing here
      # for the same reason claim-keys.json was. A help-text fix landed on main
      # and never reached a lecturer, with nothing red anywhere; it only looked
      # deployed because every edit so far happened to travel with a
      # frontend/** change.
      - 'MANUAL.md'
      - 'scripts/build-manual.mjs'
      - '.github/workflows/deploy-frontend.yml'
      # The two scripts this workflow RUNS, which is the same rule one level
      # out: they decide what the published artifact contains, so a change to
      # either has to be able to reach the site. Removing the republished
      # legacy `public/teams` cohort lists landed on main and would have sat
      # there until some unrelated frontend change happened to fire a deploy;
      # so would a fix to the privacy gate itself. Named individually rather
      # than `scripts/**`, which would deploy on every unrelated script change.
      - 'scripts/fetch-pages-data.mjs'
      - 'scripts/report-kept-orgs.mjs'
      - 'pages/scan.mjs'
      - 'pages/beta-unavailable.html'

  # A RELEASE IS A BUILD INPUT, and it was missing here for the same reason
  # `claim-keys.json` and `MANUAL.md` were missing above: the bundle reads
  # something this list did not name. "Resolve build identity" below stamps the
  # version from `git describe --tags`, so what the app says about itself is
  # decided by which tags existed AT BUILD TIME - and a tag is created after the
  # commit it names has already deployed.
  #
  # Measured on 2026-09-18: the deploy for `affe250` finished at 01:22:17Z and
  # v1.3.0 was tagged at 01:34:43Z, so the live site advertised `v1.2.1
  # (affe250)` - a version the release notes say is two days and 53 commits old.
  # Nothing was red, and nothing would have corrected it until some unrelated
  # frontend change happened to fire a deploy, at which point the number would
  # jump without anybody touching the release.
  #
  # SO A RELEASE DISPATCHES THIS WORKFLOW, and there is no `release:` trigger.
  # semantic-release authenticates with `secrets.GITHUB_TOKEN`, and GitHub
  # deliberately starts no workflow run from an event that token raises
  # (measured 2026-09-22: v1.3.1 published, no deploy run, the site kept
  # advertising v1.3.0). `release.yml` dispatches this workflow on `main`
  # itself. A `release: [published]` trigger was kept "for a release cut by
  # hand" and could never have deployed: a release event runs on the TAG ref,
  # and both environments this uses admit branch `main` only (third review,
  # 2026-09-26). A release cut by hand is followed by Run workflow here.
  #
  # A push to the `beta` branch dispatches it too (beta-channel.yml), for the
  # same reason: both environments admit `main` only, so the site is always
  # deployed from here and the beta is one of the things it contains.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # THE BETA CHANNEL: the `beta` branch's SPA, published at `<site>/beta/` on
  # the same origin as production, so a lecturer stays signed in and tests
  # against the real organizations - the only place this app can really be
  # tested. ARCHITECTURE.md §10.8 has the rules; the shape of this job is them.
  #
  # Its own job, with NO environment: `build` below is in `provisioning`, and
  # branch code (its package.json scripts, its dependencies' install scripts)
  # never runs in a job that can read the App key. Credentials only run from
  # `main`, and this job holds none - `persist-credentials: false` so not even
  # the read-only GITHUB_TOKEN sits in `.git/config` while that code runs.
  #
  # Its failure must not cost production its deploy, so `build` runs on
  # `!cancelled()` and publishes a page saying no beta is available instead.
  build-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.find.outputs.sha }}
    steps:
      - name: Find the beta branch
        id: find
        run: |
          set -euo pipefail
          # Empty when there is no beta branch, which is the ordinary state.
          SHA="$(git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/beta | cut -f1)"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "beta: ${SHA:-(no beta branch)}"

      - name: Checkout beta
        if: steps.find.outputs.sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.find.outputs.sha }}
          persist-credentials: false
          # origin/main, for the schema check below.
          fetch-depth: 0

      # The hub validates every control-repo document against MAIN's schemas,
      # and the SPA validates what it writes against the schemas it was built
      # with. A beta whose schemas differ writes documents the backend does not
      # expect, into real courses. Identical, or there is no beta: merge main
      # into beta to pick up a schema change.
      - name: Refuse a beta whose schemas differ from main
        if: steps.find.outputs.sha != ''
        run: |
          set -euo pipefail
          if ! git diff --quiet origin/main HEAD -- schemas/; then
            echo "::error::schemas/ on beta differs from main. Merge main into beta; a schema change lands on main first."
            git diff --stat origin/main HEAD -- schemas/
            exit 1
          fi

      - name: Setup Node
        if: steps.find.outputs.sha != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        if: steps.find.outputs.sha != ''
        run: npm ci --omit=dev

      - name: Install dependencies
        if: steps.find.outputs.sha != ''
        run: npm ci
        working-directory: ./frontend

      - name: Copy schemas
        if: steps.find.outputs.sha != ''
        run: |
          mkdir -p frontend/public/schemas
          cp schemas/*.schema.json frontend/public/schemas/

      - name: Build
        if: steps.find.outputs.sha != ''
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/beta/
          # Every link the beta hands out (invitations, confirm-email, the App
          # manifest) points at production - frontend/src/lib/channel.js.
          VITE_PUBLIC_BASE_URL: /${{ github.event.repository.name }}/
          VITE_BUILD_CHANNEL: beta
          VITE_BUILD_SHA: ${{ steps.find.outputs.sha }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_CORS_PROXY_URL: ${{ secrets.VITE_CORS_PROXY_URL }}

      - name: Upload the beta build
        if: steps.find.outputs.sha != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-site
          path: frontend/dist
          retention-days: 1

  build:
    needs: build-beta
    if: ${{ !cancelled() }}
    environment: provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The workflow's own three, plus: read the previous deployment's artifact,
    # and alert on the hub's issue when an organization was kept as it was.
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags, so the build can name the release it came from. A default
          # checkout fetches none, and `git describe` would then report nothing
          # on every deploy - a version that is silently always absent is worse
          # than no version field at all, because the field looks like it works.
          fetch-tags: true
          fetch-depth: 0

      - name: Resolve build identity
        id: build_id
        run: |
          set -e
          # The most recent tag reachable from this commit, or empty. Empty is a
          # legitimate answer before the first release, and build-info.js
          # renders the SHA alone rather than inventing a number.
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION:-(untagged)} at ${GITHUB_SHA}"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # The SPA imports lib/*.mjs from the repo root; those modules resolve
      # their packages (yaml) from the root node_modules.
      - name: Install root dependencies
        run: npm ci --omit=dev

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Copy schemas
        run: |
          mkdir -p frontend/public/schemas
          cp schemas/*.schema.json frontend/public/schemas/

      - name: Fetch participating orgs definition
        run: |
          git fetch origin participating-orgs:participating-orgs || true
          git show participating-orgs:participating-orgs.yml > participating-orgs.yml || true

      # What the previous deployment published, so an organization this run
      # cannot read keeps its last pages instead of stopping every other
      # organization's (scripts/fetch-pages-data.mjs keepPrevious). The newest
      # unexpired `github-pages` artifact is the previous deployment's site.
      # None (more than a day without a deploy) or none readable is not an
      # error: the fetch then fails an unreadable org as it always did.
      - name: Unpack the previous deployment
        run: |
          set -uo pipefail
          PREV="${RUNNER_TEMP}/previous-site"
          ZIP="${RUNNER_TEMP}/previous.zip"
          mkdir -p "$PREV"
          LIST="repos/${GITHUB_REPOSITORY}/actions/artifacts?name=github-pages&per_page=30"
          NEWEST='[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty'
          if ! ID=$(gh api -H "X-GitHub-Api-Version: ${GITHUB_API_VERSION}" "$LIST" --jq "$NEWEST"); then
            ID=""
          fi
          if [ -z "$ID" ]; then
            echo "No previous deployment to keep pages from."
            exit 0
          fi
          if gh api -H "X-GitHub-Api-Version: ${GITHUB_API_VERSION}" "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > "$ZIP" \
            && unzip -q -o "$ZIP" -d "${RUNNER_TEMP}/previous" \
            && tar -xf "${RUNNER_TEMP}/previous/artifact.tar" -C "$PREV"; then
            echo "Previous deployment unpacked (artifact ${ID})."
          else
            echo "::warning::The previous deployment could not be unpacked; an unreadable organization fails this deploy."
            rm -rf "$PREV" && mkdir -p "$PREV"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # lib/github-api-version.mjs, which YAML cannot import; the test
          # tests/github-api-version.test.mjs holds this equal to it.
          GITHUB_API_VERSION: "2026-03-10"

      - name: Fetch public pages data from org control repos
        run: node scripts/fetch-pages-data.mjs
        env:
          PXL_APP_CLIENT_ID: ${{ secrets.PXL_APP_CLIENT_ID }}
          PXL_APP_PRIVATE_KEY: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          PREVIOUS_SITE_DATA: ${{ runner.temp }}/previous-site/data
          KEPT_ORGS_FILE: ${{ runner.temp }}/kept-orgs.json

      # The deploy succeeds with an organization kept as it was, so nothing
      # else would say its students are not getting its changes.
      - name: Tell an administrator about organizations kept as they were
        run: node scripts/report-kept-orgs.mjs
        env:
          KEPT_ORGS_FILE: ${{ runner.temp }}/kept-orgs.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          # What is running, readable from the app itself. Answering "which
          # build were you on" used to mean listing deploy runs and matching
          # headSha by hand, which a lecturer cannot do at all.
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_VERSION: ${{ steps.build_id.outputs.version }}
          # The SECOND device-flow proxy now, not the first. The PXL-owned Worker
          # is primary and comes from deployment.yml, which is why there is no
          # VITE_CORS_PROXY_FALLBACK_URL here any more - auth.js stopped reading
          # it, and a secret the build passes that nothing reads is a value
          # people keep maintaining for no effect. See deployment.yml.
          VITE_CORS_PROXY_URL: ${{ secrets.VITE_CORS_PROXY_URL }}

      # THE GATE AT THE MOMENT OF PUBLICATION, which did not exist.
      #
      # pages/scan.mjs was invoked from exactly one place - pages/action.yml -
      # which runs when an ORG's control repo regenerates its own `public/`. This
      # workflow is what actually puts bytes on a world-readable site, and it ran
      # no scan at all: `scripts/fetch-pages-data.mjs` copies `public/i/*.json`
      # and `public/teams/*.json` verbatim out of twelve control repos into
      # `frontend/public/data`, and whatever is in them ships. Anything that
      # reached a control repo's `public/` by another route - hand-edited, left
      # by an older generator, or from a run where the gate was skipped - was
      # published unchecked.
      #
      # Scoped to `dist/data` rather than all of `dist`, and that is deliberate
      # rather than timid: `dist/data` is the aggregated, externally-sourced half
      # and the only part of the artifact this repo does not author. The rest is
      # the SPA bundle and `schemas/*.schema.json`, which legitimately and
      # necessarily contain `"student_number":` - scanning them would fail every
      # deploy on the field-name rules and the gate would be turned off within a
      # week, which is how a check stops being read.
      - name: Privacy scan the published data
        run: node pages/scan.mjs frontend/dist/data

      # Static files only: nothing the beta built runs in this job.
      - name: Download the beta build
        if: needs.build-beta.result == 'success' && needs.build-beta.outputs.sha != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: beta-site
          path: frontend/dist/beta

      # beta/index.html ALWAYS exists - the app, or a page saying there is none.
      # 404.html sends any deep link under beta/ to beta/?/..., and with nothing
      # there that would 404 straight back into 404.html, for ever.
      - name: Assemble the beta channel
        env:
          BETA_BUILT: ${{ needs.build-beta.result == 'success' && needs.build-beta.outputs.sha != '' }}
        run: |
          set -euo pipefail
          if [ "$BETA_BUILT" = "true" ]; then
            # The beta reads data/ under its own base. The same bytes the scan
            # above just passed, not a second fetch.
            rm -rf frontend/dist/beta/data
            cp -R frontend/dist/data frontend/dist/beta/data
          else
            mkdir -p frontend/dist/beta
            cp pages/beta-unavailable.html frontend/dist/beta/index.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    # Decided on the production build ALONE. Without this the default
    # `success()` reads the whole `needs:` chain, so a failed `build-beta`
    # skipped this job even though `build` had succeeded and already put the
    # "no beta" page in the artifact: on 2026-10-02 a schema change on main
    # made the beta (correctly) refuse to build, and four production deploys
    # in a row were skipped. CLAUDE.md: one failure must not skip another's work.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
