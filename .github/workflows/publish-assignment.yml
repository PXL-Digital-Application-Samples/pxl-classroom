name: Publish assignment
on:
  workflow_dispatch:
    inputs:
      org:
        description: "Organization"
        required: true
        type: string
      assignment_id:
        description: "Assignment ID"
        required: true
        type: string
      regenerate_invite:
        description: "Regenerate the invitation link (retires every link already handed out)"
        type: boolean
        default: false
      dry_run:
        description: "Dry run"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      
      - name: Mint App token for Org
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ inputs.org }}
          
      - name: Checkout control repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.org }}/pxl-classroom-control
          token: ${{ steps.token.outputs.token }}
          path: control

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - run: npm ci --omit=dev

      - name: Validate assignment
        working-directory: control
        env:
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
        run: |
          if [ ! -f "assignments/${ASSIGNMENT_ID}.yml" ] && [ ! -f "assignments/${ASSIGNMENT_ID}.json" ]; then
            echo "::error::Assignment file not found"
            exit 1
          fi

      # Mints the signed invitation token and records it in the PRIVATE control
      # repo. Republishing keeps the existing link alive; regenerate_invite
      # retires every link already handed out. See ARCHITECTURE §4.3.2.
      - name: Mint invitation token
        id: invite
        if: inputs.dry_run != true
        env:
          DATA_DIR: control
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
          ORG: ${{ inputs.org }}
          INVITE_SIGNING_KEY: ${{ secrets.PXL_INVITE_SIGNING_KEY }}
          INVITE_KID: ${{ vars.INVITE_KID }}
          REGENERATE: ${{ inputs.regenerate_invite }}
        run: node scripts/set-assignment-invite.mjs

      - name: Publish broker
        if: inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
          ORG: ${{ inputs.org }}
          INVITE_NONCE: ${{ steps.invite.outputs.nonce }}
          INVITE_TOKEN: ${{ steps.invite.outputs.token }}
          PXL_APP_CLIENT_ID: ${{ secrets.PXL_APP_CLIENT_ID }}
          PXL_APP_PRIVATE_KEY: ${{ secrets.PXL_APP_PRIVATE_KEY }}
        run: |
          BROKER_REPO="broker-${ASSIGNMENT_ID}"
          if gh repo view "${ORG}/${BROKER_REPO}" --json name > /dev/null 2>&1; then
            echo "Broker repo ${ORG}/${BROKER_REPO} already exists - ensuring issues are enabled"
            gh repo edit "${ORG}/${BROKER_REPO}" --enable-issues
          else
            gh repo create "${ORG}/${BROKER_REPO}" \
              --public \
              --description "Assignment acceptance broker for ${ASSIGNMENT_ID}" \
              --disable-wiki \
              --enable-issues
            echo "Created broker repo ${ORG}/${BROKER_REPO}"
          fi

          gh variable set ASSIGNMENT_ID --body "${ASSIGNMENT_ID}" --repo "${ORG}/${BROKER_REPO}"
          gh variable set CONTROL_ORG --body "${ORG}" --repo "${ORG}/${BROKER_REPO}"
          # The nonce is what the broker checks a token against, so writing it
          # here is what actually retires superseded links. INVITE_ENABLED is a
          # kill switch evaluated in the job-level `if`, before a runner is
          # allocated - switching it off costs nothing at all.
          gh variable set INVITE_NONCE --body "${INVITE_NONCE}" --repo "${ORG}/${BROKER_REPO}"
          gh variable set INVITE_ENABLED --body "true" --repo "${ORG}/${BROKER_REPO}"

          # Automatically populate App secrets on the broker repository
          echo "$PXL_APP_CLIENT_ID" | gh secret set PXL_APP_CLIENT_ID --repo "${ORG}/${BROKER_REPO}"
          echo "$PXL_APP_PRIVATE_KEY" | gh secret set PXL_APP_PRIVATE_KEY --repo "${ORG}/${BROKER_REPO}"

          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${ORG}/${BROKER_REPO}.git"
          mkdir -p .github/workflows
          
          # Copy from pxl-classroom workspace
          cp "${GITHUB_WORKSPACE}/acceptance/broker-workflow.yml" .github/workflows/acceptance-trigger.yml

          # No acceptance link in the README: this repository is public, and the
          # invitation token is what keeps an outsider from triggering work here.
          cat > README.md << 'READMEEOF'
          # Assignment acceptance broker

          > This is an automated repository managed by PXL Classroom.

          Acceptance happens through your invitation link, which your lecturer
          distributes. Opening an issue here by hand does nothing.
          READMEEOF

          git add -A
          git config user.name "pxl-classroom[bot]"
          git config user.email "pxl-classroom[bot]@users.noreply.github.com"
          git commit -m "Initialize broker for ${ASSIGNMENT_ID}"
          git branch -M main
          git push -u origin main --force

          # The hub is public and so are its run logs and step summaries.
          # The invitation token must never be printed here.
          {
            echo "### [OK] Published assignment"
            echo "| field | value |"
            echo "|---|---|"
            echo "| assignment | ${ASSIGNMENT_ID} |"
            echo "| broker | ${ORG}/${BROKER_REPO} |"
            echo "| invitation | recorded in the control repo - copy it from the Admin Panel |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update assignment state
        if: inputs.dry_run != true
        env:
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
        run: |
          set -e
          FILE="assignments/${ASSIGNMENT_ID}.yml"
          if [ -f "control/$FILE" ]; then
            sed -i "s/^state:.*/state: published/" "control/$FILE"
          else
            FILE="assignments/${ASSIGNMENT_ID}.json"
            node scripts/update-json-field.mjs --schema assignment "control/$FILE" "state" "published"
          fi

          git -C control config user.name "pxl-classroom[bot]"
          git -C control config user.email "pxl-classroom[bot]@users.noreply.github.com"
          # Also carries invite_token / invite_nonce / invite_expires_at from the
          # Mint invitation token step - all of it stays in the private repo.
          git -C control add "$FILE"
          git -C control diff --cached --quiet || git -C control commit -m "Publish assignment ${ASSIGNMENT_ID}"
          scripts/git-push-with-retry.sh control

      - name: Enable daily activity workflow
        if: inputs.dry_run != true
        run: |
          echo "Assignment published! Waking up the daily-activity workflow."
          gh workflow enable daily-activity.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger dashboard regeneration
        if: inputs.dry_run != true
        run: |
          gh workflow run regenerate-dashboard.yml --field org="$ORG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ inputs.org }}
