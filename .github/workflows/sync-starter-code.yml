name: Sync Starter Code
on:
  workflow_dispatch:
    inputs:
      org:
        description: "Organization"
        required: true
        type: string
      assignment_id:
        description: "Assignment ID"
        required: true
        type: string
      selected_files:
        description: "JSON array of selected file paths (e.g. [\"*\"])"
        required: false
        type: string
        default: '["*"]'
      pr_title:
        description: "Custom PR / commit title"
        required: false
        type: string
        default: ""
      pr_body:
        description: "Custom PR / issue description"
        required: false
        type: string
        default: ""
      create_issue:
        description: "Open tracking issue in student repositories"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sync-starter:
    environment: provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # A lecturer dispatches this as themselves, through the SPA or the Actions
      # tab. The only other thing that can reach workflow_dispatch here is an App
      # installation token - which is what a stolen broker credential would be -
      # and it arrives as `<app-slug>[bot]`. Deny that identity rather than
      # maintaining an allowlist of people.
      #
      # This job holds PXL_APP_PRIVATE_KEY via `environment: provisioning` and
      # mints a token for an ARBITRARY org from its own input, so it is exactly
      # the shape the guard exists for. It was the only dispatch-triggered
      # workflow carrying the App key that did not have it - along with
      # open-feedback-prs.yml, its sibling, which had the same gap for the same
      # reason: the pair was written at a different time and swept by nothing
      # since. tests/workflow-hardening.test.mjs now pins the class.
      - name: Reject automated dispatch
        if: github.event_name == 'workflow_dispatch' && endsWith(github.actor, '[bot]')
        env:
          ACTOR: ${{ github.actor }}
        run: |
          echo "::error::$ACTOR may not dispatch this workflow; a lecturer must run it"
          exit 1

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      
      - name: Mint App token for Org
        id: token
        # v1 takes `app-id` and has no `client-id` input, so this step died with
        # "Input required and not supplied: app-id" on every run - the workflow
        # never once reached the sync. Pinned to the same SHA as every other
        # workflow in the repo, which is v3.2.0 and does take `client-id`.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ inputs.org }}
          
      - name: Checkout control repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.org }}/pxl-classroom-control
          token: ${{ steps.token.outputs.token }}
          path: control

      # Pinned to a SHA like every other action in the repo. This was
      # `actions/setup-node@v4`, a MUTABLE tag, in a step that runs AFTER the App
      # token has been minted and with PXL_APP_PRIVATE_KEY in scope - so a
      # compromised tag would have executed with both in the environment. It and
      # open-feedback-prs.yml were the last two unpinned references; the same
      # sweep that moved them to node 24 missed the pin.
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - run: npm ci --omit=dev

      - name: Execute Starter Code Sync
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ inputs.org }}
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
          DATA_DIR: control
          SELECTED_FILES: ${{ inputs.selected_files }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BODY: ${{ inputs.pr_body }}
          CREATE_ISSUE: ${{ inputs.create_issue }}
          ACTOR: ${{ github.actor }}
        run: |
          node scripts/sync-starter.mjs

      - name: Commit sync records
        working-directory: control
        env:
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
        run: |
          git config user.name "PXL Classroom Provisioner"
          git config user.email "pxl-classroom@users.noreply.github.com"
          if [ -n "$(git status --porcelain syncs/)" ]; then
            mkdir -p syncs
            git add syncs/
            git commit -m "Record starter code sync for ${ASSIGNMENT_ID}"
            # See open-feedback-prs.yml: a bare push loses to any concurrent
            # write to this control repo, and this workflow is dispatch-only
            # so it runs precisely when other things are also writing.
            ../scripts/git-push-with-retry.sh
          else
            echo "No sync records to commit."
          fi
