name: Sync Starter Code
# Names the assignment, so the sync dialog can tell a sync of THIS assignment
# that is already running or queued - before it has written any record - from
# one of another. A run name is a title, not a script.
run-name: "Sync Starter Code: ${{ inputs.assignment_id }} (${{ inputs.org }})"
on:
  workflow_dispatch:
    inputs:
      org:
        description: "Organization"
        required: true
        type: string
      assignment_id:
        description: "Assignment ID"
        required: true
        type: string
      selected_files:
        description: "JSON array of selected file paths (e.g. [\"*\"])"
        required: false
        type: string
        default: '["*"]'
      pr_title:
        description: "Custom PR / commit title"
        required: false
        type: string
        default: ""
      pr_body:
        description: "Custom PR / issue description"
        required: false
        type: string
        default: ""
      create_issue:
        description: "Open tracking issue in student repositories"
        required: false
        type: boolean
        default: true
      template_commit:
        description: "Template commit to sync (sha, e.g. 1e7f714). Empty = the newest commit."
        required: false
        type: string
        default: ""

permissions:
  contents: read

# One sync of an assignment at a time: two at once work the same students in
# parallel (a double click did exactly this on 2026-09-25). A second waits
# rather than cancelling the first - a sync half-done is worse than one late.
# GitHub keeps ONE waiting run per group, so a third replaces the second.
concurrency:
  group: sync-starter-${{ inputs.org }}-${{ inputs.assignment_id }}
  cancel-in-progress: false

jobs:
  sync-starter:
    environment: provisioning
    runs-on: ubuntu-24.04
    # THREE ROUNDS, EACH ON ITS OWN TOKEN. An App installation token lives one
    # hour, so one round stops itself after 52 minutes (scripts/sync-starter.mjs
    # `budgetMs`) and says whether students are left (`continues`). If so the
    # next round mints a fresh token, checks the control repository out again
    # and runs the same script, which skips everyone who has the change. A
    # lab of 18 MiB per student needed four runs by hand for 145 students
    # (2026-11-13); this is those runs without the pressing. After the third
    # round it stops and says who is left, so a sync that cannot finish does
    # not hold the assignment's slot all day. Three hours for three rounds;
    # each sync step has its own limit below the token's hour.
    timeout-minutes: 180
    steps:
      # A lecturer dispatches this as themselves, through the SPA or the Actions
      # tab. The only other thing that can reach workflow_dispatch here is an App
      # installation token - which is what a stolen broker credential would be -
      # and it arrives as `<app-slug>[bot]`. Deny that identity rather than
      # maintaining an allowlist of people.
      #
      # This job holds PXL_APP_PRIVATE_KEY via `environment: provisioning` and
      # mints a token for an ARBITRARY org from its own input, so it is exactly
      # the shape the guard exists for. It was the only dispatch-triggered
      # workflow carrying the App key that did not have it - along with
      # open-feedback-prs.yml, its sibling, which had the same gap for the same
      # reason: the pair was written at a different time and swept by nothing
      # since. tests/workflow-hardening.test.mjs now pins the class.
      - name: Reject automated dispatch
        if: github.event_name == 'workflow_dispatch' && endsWith(github.actor, '[bot]')
        env:
          ACTOR: ${{ github.actor }}
        run: |
          echo "::error::$ACTOR may not dispatch this workflow; a lecturer must run it"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Mint App token for Org
        id: token
        # v1 takes `app-id` and has no `client-id` input, so this step died with
        # "Input required and not supplied: app-id" on every run - the workflow
        # never once reached the sync. Pinned to the same SHA as every other
        # workflow in the repo, which is v3.2.0 and does take `client-id`.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ inputs.org }}
          # Every repository: sync-starter.mjs reads the template and writes into
          # the student repositories named in the records. Contents for the git
          # data API and the control-repo push, pull requests and issues for the
          # PR and the tracking issue, and workflows because a template commit
          # that touches .github/workflows/ cannot be written without it
          # (lib/app-token-scopes.mjs).
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write

      - name: Checkout control repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.org }}/pxl-classroom-control
          token: ${{ steps.token.outputs.token }}
          path: control

      # Pinned to a SHA like every other action in the repo. This was
      # `actions/setup-node@v4`, a MUTABLE tag, in a step that runs AFTER the App
      # token has been minted and with PXL_APP_PRIVATE_KEY in scope - so a
      # compromised tag would have executed with both in the environment. It and
      # open-feedback-prs.yml were the last two unpinned references; the same
      # sweep that moved them to node 24 missed the pin.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --omit=dev

      - name: Execute Starter Code Sync
        id: round1
        # Below the token's hour: a step that hangs is ended while its
        # credential still is one, and the job goes red rather than on.
        timeout-minutes: 58
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ inputs.org }}
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
          DATA_DIR: control
          SELECTED_FILES: ${{ inputs.selected_files }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BODY: ${{ inputs.pr_body }}
          CREATE_ISSUE: ${{ inputs.create_issue }}
          TEMPLATE_COMMIT: ${{ inputs.template_commit }}
          ACTOR: ${{ github.actor }}
          SYNC_ROUND: "1"
          SYNC_ROUNDS: "3"
        # The script writes its own record - when it starts, as it goes and
        # when it ends - through the Git Data API. A record committed by a
        # later step was never written at all when the timeout stopped the
        # sync, so nothing could say who had been reached.
        run: |
          node scripts/sync-starter.mjs

      # ---- Round 2: only when round 1 said students are left ----------------
      # `steps.<id>.outputs.continues` of a step that failed, was skipped or
      # ended early is the empty string, so nothing below runs after anything
      # but a round that recorded where it got to.
      - name: Mint App token for round 2
        id: token_round2
        if: steps.round1.outputs.continues == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ inputs.org }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write

      # Again, not reused: the records round 1 wrote are read from here, and
      # the first checkout's stored credential is the token that is expiring.
      - name: Checkout control repo for round 2
        if: steps.round1.outputs.continues == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.org }}/pxl-classroom-control
          token: ${{ steps.token_round2.outputs.token }}
          path: control

      - name: Execute Starter Code Sync, round 2
        id: round2
        if: steps.round1.outputs.continues == 'true'
        timeout-minutes: 58
        env:
          GITHUB_TOKEN: ${{ steps.token_round2.outputs.token }}
          ORG: ${{ inputs.org }}
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
          DATA_DIR: control
          SELECTED_FILES: ${{ inputs.selected_files }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BODY: ${{ inputs.pr_body }}
          CREATE_ISSUE: ${{ inputs.create_issue }}
          TEMPLATE_COMMIT: ${{ inputs.template_commit }}
          ACTOR: ${{ github.actor }}
          SYNC_ROUND: "2"
          SYNC_ROUNDS: "3"
        run: |
          node scripts/sync-starter.mjs

      # ---- Round 3: the last. What it does not reach, it says ---------------
      - name: Mint App token for round 3
        id: token_round3
        if: steps.round2.outputs.continues == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ inputs.org }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write

      - name: Checkout control repo for round 3
        if: steps.round2.outputs.continues == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.org }}/pxl-classroom-control
          token: ${{ steps.token_round3.outputs.token }}
          path: control

      - name: Execute Starter Code Sync, round 3
        id: round3
        if: steps.round2.outputs.continues == 'true'
        timeout-minutes: 58
        env:
          GITHUB_TOKEN: ${{ steps.token_round3.outputs.token }}
          ORG: ${{ inputs.org }}
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
          DATA_DIR: control
          SELECTED_FILES: ${{ inputs.selected_files }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BODY: ${{ inputs.pr_body }}
          CREATE_ISSUE: ${{ inputs.create_issue }}
          TEMPLATE_COMMIT: ${{ inputs.template_commit }}
          ACTOR: ${{ github.actor }}
          SYNC_ROUND: "3"
          SYNC_ROUNDS: "3"
        run: |
          node scripts/sync-starter.mjs
