name: Pipeline Watchdog & Sentinel
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      alert_level:
        description: 'Alert Notification Level'
        type: choice
        options:
          - stuck_and_failures
          - all
          - critical_only
          - off
        default: stuck_and_failures
      auto_cancel:
        description: 'Auto-cancel zombie runs waiting over 20 minutes'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --omit=dev
      - name: Run Pipeline Watchdog
        run: node scripts/pipeline-watchdog.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUB_OWNER: ${{ github.repository_owner }}
          HUB_REPO: ${{ github.event.repository.name }}
          ALERT_LEVEL: ${{ inputs.alert_level || 'stuck_and_failures' }}
          # On the schedule there are no inputs, and `inputs.auto_cancel !=
          # false` was false there: GitHub compares null and false as the same
          # number, so the scheduled watchdog never cancelled anything
          # (measured, TV-8 and the 2026-10-15 audit). On by default, as the
          # dispatch input says.
          AUTO_CANCEL: ${{ github.event_name == 'schedule' || inputs.auto_cancel }}
