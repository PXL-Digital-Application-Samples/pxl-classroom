name: Retry Acceptance

# Lecturer-triggerable rescue for half-done acceptances.
# Wipes the per-student acceptance file in the control repo, then re-runs the
# full acceptance + provisioning sequence under the same concurrency group as
# the normal acceptance-handler.

on:
  workflow_dispatch:
    inputs:
      org:
        description: Target organization
        required: true
        type: string
      assignment_id:
        description: Assignment ID (slug)
        required: true
        type: string
      github_login:
        description: Student GitHub login
        required: true
        type: string
      bypass_window:
        description: Bypass assignment time windows
        required: false
        type: string
        default: 'true'
      team_slug:
        description: >-
          For a GROUP assignment, the team this student is in (shown on the
          tracking page). Used ONLY to serialize this retry against concurrent
          joins to that same team - it does not move the student, and the
          acceptance still resolves the team from the manifests as before.
          Leave empty for individual assignments.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: write # dispatches regenerate-dashboard.yml

# MUST MIRROR acceptance-handler.yml's group exactly, because GitHub serializes
# only runs whose group STRING matches. This keyed on github_login alone while
# the ordinary acceptance keys on `team_hint || github_login`, so for a group
# assignment the two produced different strings and neither waited for the
# other: a lecturer's retry and a student's join on the same team could both
# read the manifest at n-1 members and both append, past max_team_size. That
# per-team serialization is the ONLY thing guarding team capacity - there is no
# distributed lock (ARCHITECTURE 5.8) - and accept.mjs really does
# members.push() then writeFile().
#
# The retry cannot discover the team on its own: a concurrency group is
# evaluated before any step runs. So the lecturer supplies it, and when they do
# the two keys coincide. Left empty it behaves exactly as before.
concurrency:
  group: accept-${{ inputs.org }}-${{ inputs.assignment_id }}-${{ inputs.team_slug || inputs.github_login }}
  cancel-in-progress: false

jobs:
  retry:
    environment: provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A lecturer dispatches these as themselves, through the SPA or the
      # Actions tab. The only other thing that can reach workflow_dispatch here
      # is an App installation token - which is what a stolen broker credential
      # would be - and it arrives as `<app-slug>[bot]`. Deny that identity
      # rather than maintaining an allowlist of people.
      #
      # It does NOT stop a stolen user credential, which acts as its owner. That
      # is the residual, and rulesets plus the provisioning environment are what
      # bound it.
      - name: Reject automated dispatch
        if: github.event_name == 'workflow_dispatch' && endsWith(github.actor, '[bot]')
        env:
          ACTOR: ${{ github.actor }}
        run: |
          echo "::error::$ACTOR may not dispatch this workflow; a lecturer must run it"
          exit 1

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: npm ci --omit=dev

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: ${{ inputs.org }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.org }}/pxl-classroom-control
          token: ${{ steps.token.outputs.token }}
          path: control

      # Every value below reaches the shell through env:, never through a
      # substituted expression. `${{ }}` is pasted into the script TEXT before
      # bash sees it; an env var is data. These are workflow_dispatch inputs, so
      # only a lecturer can set them - but this job runs with the App key in
      # scope and provisions for an arbitrary login with the deadline bypassed,
      # which is the last place to rely on the caller being well behaved
      # (ARCHITECTURE 4.3.1).
      - name: Validate dispatch inputs
        id: valid
        env:
          ORG: ${{ inputs.org }}
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
          GITHUB_LOGIN: ${{ inputs.github_login }}
          TEAM_SLUG: ${{ inputs.team_slug }}
        run: |
          printf '%s' "$ORG" | grep -Eq '^[A-Za-z0-9](-?[A-Za-z0-9]){0,38}$' \
            || { echo "::error::org is not a valid GitHub login"; exit 1; }
          printf '%s' "$GITHUB_LOGIN" | grep -Eq '^[A-Za-z0-9](-?[A-Za-z0-9]){0,38}$' \
            || { echo "::error::github_login is not a valid GitHub login"; exit 1; }
          # The same slug shape accept.mjs enforces before it touches a path.
          printf '%s' "$ASSIGNMENT_ID" | grep -Eq '^[a-z0-9][a-z0-9-]{0,99}$' \
            || { echo "::error::assignment_id is not a valid slug"; exit 1; }
          # A concurrency key is evaluated by GitHub rather than a shell, so
          # this cannot reach a command line - but this file validates every
          # input as its first use and a new one is no exception. The shape is
          # lib/team-payload.mjs's TEAM_SLUG.
          if [ -n "$TEAM_SLUG" ]; then
            printf '%s' "$TEAM_SLUG" | grep -Eq '^[a-z0-9][a-z0-9-]{0,63}$' \
              || { echo "::error::team_slug is not a valid team slug"; exit 1; }
          fi

      - name: Look up student GitHub numeric ID
        id: lookup
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_LOGIN: ${{ inputs.github_login }}
        run: |
          # `gh` WRITES API ERRORS TO STDOUT. Measured 2026-08-26: a 404 exits 1
          # and prints {"message":"Not Found",...,"status":"404"} on stdout,
          # with only the human-readable line on stderr. So the captured value
          # is NON-EMPTY for a mistyped login and `[ -z "$ID" ]` could never
          # fire - the guard that used to be here was unreachable.
          #
          # Actions runs this with `bash -e`, so the assignment did abort the
          # step, which is why this never produced a wrong id. It produced the
          # wrong MESSAGE: a lecturer retrying an acceptance for a colleague
          # they had misspelled got `gh: Not Found (HTTP 404)` instead of being
          # told which login does not exist.
          #
          # The exit code is the only reliable signal, and the shape is the only
          # reliable check on what came back - `--jq` prints the string "null"
          # for a field GitHub omits, which is non-empty too.
          if ! ID=$(gh api "users/${GITHUB_LOGIN}" --jq .id 2>"${RUNNER_TEMP}/lookup.err"); then
            echo "::error::No GitHub account named ${GITHUB_LOGIN}, or it could not be looked up: $(tr '\n\r' '  ' < "${RUNNER_TEMP}/lookup.err" | cut -c1-200). Check the spelling."
            exit 1
          fi
          case "$ID" in
            ''|*[!0-9]*)
              echo "::error::GitHub returned no numeric account id for ${GITHUB_LOGIN}."
              exit 1
              ;;
          esac
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Wipe half-done acceptance state
        env:
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
          GITHUB_LOGIN: ${{ inputs.github_login }}
        run: |
          set -e
          ACCEPT_FILE="acceptances/${ASSIGNMENT_ID}/${GITHUB_LOGIN}.json"
          if [ ! -f "control/$ACCEPT_FILE" ]; then
            echo "No prior acceptance file at $ACCEPT_FILE - proceeding to fresh acceptance."
            exit 0
          fi
          rm -f "control/$ACCEPT_FILE"

          git -C control config user.name "pxl-classroom[bot]"
          git -C control config user.email "pxl-classroom[bot]@users.noreply.github.com"
          git -C control add -A
          git -C control commit -m "Reset acceptance state for ${GITHUB_LOGIN} on ${ASSIGNMENT_ID} (manual retry)"
          # Was `git pull --rebase || true; git push`, which pushed whatever the
          # working tree held even when the rebase had failed. The retry helper
          # rebases properly and fails if it cannot.
          scripts/git-push-with-retry.sh control

      - name: Run acceptance
        id: accept
        uses: ./acceptance
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ inputs.org }}
          control-repo: pxl-classroom-control
          data-dir: control
          assignment-id: ${{ inputs.assignment_id }}
          github-login: ${{ inputs.github_login }}
          github-id: ${{ steps.lookup.outputs.id }}
          workflow-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          bypass-window: ${{ inputs.bypass_window || 'true' }}

      - if: steps.accept.outputs.outcome == 'accepted' || steps.accept.outputs.outcome == 'already-accepted'
        uses: ./provisioning
        id: prov
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ inputs.org }}
          assignment-id: ${{ inputs.assignment_id }}
          template-owner: ${{ steps.accept.outputs.template_owner }}
          template-repo: ${{ steps.accept.outputs.template_repo }}
          target-repo: ${{ steps.accept.outputs.target_repo }}
          student-login: ${{ steps.accept.outputs.github_login }}
          feedback-pr: ${{ steps.accept.outputs.feedback_pr }}
          feedback-pr-baseline-branch: ${{ steps.accept.outputs.feedback_pr_baseline_branch }}
          previous-repo: ${{ steps.accept.outputs.previous_repo }}

      - name: Notify on failure
        if: always() && (steps.accept.outputs.outcome == 'accepted' || steps.accept.outputs.outcome == 'already-accepted') && startsWith(steps.prov.outputs.outcome, 'fail')
        uses: ./notify
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          org: ${{ inputs.org }}
          control-repo: pxl-classroom-control
          event-type: provisioning-failed
          assignment-id: ${{ steps.accept.outputs.assignment_id }}
          details: |
            Manual retry failed to provision repo for `${{ steps.accept.outputs.github_login }}`.
            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          dedup-key: prov-fail-${{ steps.accept.outputs.assignment_id }}-${{ steps.accept.outputs.github_login }}

      - name: Write repository record into control checkout, push
        if: (success() || failure()) && (steps.accept.outputs.outcome == 'accepted' || steps.accept.outputs.outcome == 'already-accepted') && steps.prov.outputs.outcome != ''
        env:
          ASSIGNMENT_ID: ${{ steps.accept.outputs.assignment_id }}
          LOGIN: ${{ steps.accept.outputs.github_login }}
          TEAM_SLUG: ${{ steps.accept.outputs.team_slug }}
          OUTCOME: ${{ steps.prov.outputs.outcome }}
          ORG: ${{ inputs.org }}
          TARGET_REPO: ${{ steps.accept.outputs.target_repo }}
          REPO_ID: ${{ steps.prov.outputs.repo-id }}
          REPO_URL: ${{ steps.prov.outputs.repo-url }}
          BASELINE_SHA: ${{ steps.prov.outputs.baseline-sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e

          # `git add <dir>/` is FATAL when the directory is absent - exit 128,
          # and nothing at all is staged. Under `set -e` that kills the step,
          # so the repository gets provisioned and then its record, the
          # acceptance status and the claim binding are all discarded.
          #
          # This workflow is where it hurts most: retry-acceptance is what a
          # lecturer reaches for when a student is already in trouble. Surveyed
          # 2026-08-27 - PXL-Systems-Expert and PXL-2TIN-DevOps-2627 both lack
          # teams/, and both have a published assignment still accepting.
          # See acceptance-handler.yml for the whole story.
          if [ "$OUTCOME" = "created" ] || [ "$OUTCOME" = "reused" ]; then
            node scripts/write-repository-record.mjs \
              --assignment-id "$ASSIGNMENT_ID" \
              --login "$LOGIN" \
              --org "$ORG" \
              --target-repo "$TARGET_REPO" \
              --team-slug "$TEAM_SLUG" \
              --repo-id "$REPO_ID" \
              --repo-url "$REPO_URL" \
              --baseline-sha "$BASELINE_SHA" \
              --run-url "$RUN_URL" \
              --data-dir control
            mkdir -p control/repositories control/teams
            git -C control add "repositories/" "teams/"
          fi

          ACCEPT_FILE="acceptances/${ASSIGNMENT_ID}/${LOGIN}.json"
          if [ -f "control/$ACCEPT_FILE" ]; then
            if [ "$OUTCOME" = "created" ] || [ "$OUTCOME" = "reused" ]; then
              node scripts/update-json-field.mjs --schema acceptance "control/$ACCEPT_FILE" "status" "provisioned"
            else
              node scripts/update-json-field.mjs --schema acceptance "control/$ACCEPT_FILE" "status" "failed"
            fi
            mkdir -p control/acceptances
            git -C control add "acceptances/"
          fi

          mkdir -p control/students
          git -C control add "students/"

          git -C control config user.name "pxl-classroom[bot]"
          git -C control config user.email "pxl-classroom[bot]@users.noreply.github.com"
          git -C control diff --cached --quiet || git -C control commit -m "Retry-provision ${LOGIN} for ${ASSIGNMENT_ID} (${OUTCOME})"
          scripts/git-push-with-retry.sh control

      - name: Trigger dashboard regeneration
        if: always() && (steps.accept.outputs.outcome == 'accepted' || steps.accept.outputs.outcome == 'already-accepted')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ORG: ${{ inputs.org }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'regenerate-dashboard.yml', ref: 'main',
              inputs: { org: process.env.ORG },
            });
