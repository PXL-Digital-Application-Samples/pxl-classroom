name: CI

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # Did this push touch anything but the documents at the repository root?
  #
  # A `paths` filter is WORKFLOW-level, so it cannot skip one job - and skipping
  # the whole workflow on a `.md` change would be wrong: `doc-refs` and
  # `manual-topics` in the unit suite are the only things that catch a `§4.3.2`
  # pointing at a heading that no longer exists, in the docs and in ~340 source
  # comments and UI strings. So the unit job always runs, and this decides
  # whether the expensive half does.
  #
  # It fails OPEN. An unreadable range - a new branch, a force-push, an empty
  # diff - runs the full suite, because "we could not tell" must never be the
  # cheaper answer.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scan.outputs.code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Look at what changed
        id: scan
        # Through env:, never composed into the script text.
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "no usable range from ${BEFORE} - running everything"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$AFTER")
          if [ -z "$changed" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "empty diff - running everything"
            exit 0
          fi
          echo "$changed"
          # Anything that is not a top-level .md counts as code. Deliberately
          # blunt: a README under templates/ or a fixture that happens to end
          # in .md runs the full suite, which is the harmless direction.
          if printf '%s\n' "$changed" | grep -qvE '^[^/]+\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "documents only - end-to-end tests skipped"
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: node --test tests/*.test.mjs cli/tests/*.test.mjs

  # The unit suite does not execute components, so the only thing that ever
  # exercises a route, a click or a render is Playwright. It was not wired in
  # here, and one commit shipped 47 broken navigations across 14 spec files
  # because `node --test` never touches tests/**/*.spec.mjs.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # playwright.config.mjs starts the Vite dev server itself, so the SPA's
      # own dependencies have to be present before the suite runs.
      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npx playwright test --reporter=line

      # trace: 'on-first-retry' only produces anything when a retry happens, and
      # retries are enabled in CI - so a flake leaves a trace to open instead of
      # a line of output to guess from.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          
      - name: Install dependencies
        run: npm ci

      # The one lint command, identical to the one a developer runs. It used to
      # be three steps here and `eslint .` in package.json, so `npm run lint`
      # could pass while this job had been red since 48ed831 over a shellcheck
      # finding nothing local would ever surface. scripts/lint.mjs owns eslint,
      # workflow-lint and actionlint, and pins actionlint and shellcheck so both
      # sides report identically. tests/lint-parity.test.mjs stops them
      # separating again.
      - name: Lint
        run: npm run lint
