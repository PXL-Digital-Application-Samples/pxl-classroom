name: CI

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # eslint.config.mjs exists because undeclared identifiers keep shipping:
      # the template compiler never sees a <script setup> body, Vite bundles it
      # happily, and the unit suite does not execute components. It caught none
      # of them because it was never wired in here - `isStarred` shipped as the
      # fourth. no-undef is the point of the config; this is what enforces it.
      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Run unit tests
        run: node --test tests/*.test.mjs cli/tests/*.test.mjs

  # The unit suite does not execute components, so the only thing that ever
  # exercises a route, a click or a render is Playwright. It was not wired in
  # here, and one commit shipped 47 broken navigations across 14 spec files
  # because `node --test` never touches tests/**/*.spec.mjs.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # playwright.config.mjs starts the Vite dev server itself, so the SPA's
      # own dependencies have to be present before the suite runs.
      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npx playwright test --reporter=line

      # trace: 'on-first-retry' only produces anything when a retry happens, and
      # retries are enabled in CI - so a flake leaves a trace to open instead of
      # a line of output to guess from.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          
      - name: Install dependencies
        run: npm ci

      - name: Download actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.1
          echo "${PWD}" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint

      - name: Run bash -n syntax check
        run: node scripts/workflow-lint.mjs
