# Dependabot version updates for the hub.
#
# These are the only pull requests this repository takes. Everything else is
# committed straight to main (CLAUDE.md), but Dependabot can only deliver an
# update as a pull request, so ci.yml runs its jobs on a pull request when
# Dependabot opened it and on no other.
#
# tests/dependabot-config.test.mjs derives both directory lists from the files
# in the repository, so a new composite action or package fails the suite until
# it is listed here or excluded with a reason. It also checks that every
# commit-message prefix is a type .husky/commit-msg accepts: a merged update's
# subject feeds the release like any other commit's.
#
# Merging one: ADMIN.md §8.
version: 2
updates:
  - package-ecosystem: npm
    # The hub's own packages. The two package.json files under templates/ are
    # starter code a cohort receives, so bumping them is a lecturer's decision.
    directories:
      - "/"
      - "/cli"
      - "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    # A release is not proposed until it is a week old. A hijacked package is
    # usually caught and pulled inside that window. Security updates are not
    # held back by this.
    cooldown:
      default-days: 7
    # `fix(deps)` for a runtime dependency, which changes what ships and
    # releases a patch; `chore(deps-dev)` for tooling, which releases nothing.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    # @types/node describes the Node the hub runs, which is the `engines` floor
    # and CI's setup-node. A newer major types APIs that runtime does not have,
    # so it moves by hand, with the other two (tests/dependabot-config.test.mjs).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the Go compiler, and it checks JavaScript the way it
      # checks TypeScript: JSDoc `object` stops meaning `any` and a `= {}`
      # default types as `{}`. Measured 2026-09-17 on `npm run typecheck`: 63
      # findings on 6.0.3, 231 on 7.0.2, the same 63 plus 168 of that one
      # change, across 79 annotations and 22 destructurings in lib/. It moves
      # by hand, with that sweep (LESSONS.md, "JSDoc `object` meant `any`").
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      # ESLint, its config package and its Vue plugin are one lint setup, so a
      # major moves all three in one pull request.
      eslint-major:
        update-types: [major]
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*"]
      # One pull request per major, across all three directories. Without
      # group-by, a major arrives as one pull request per directory, and the
      # three copies of `yaml` would move at different times.
      #
      # It must EXCLUDE the ESLint names. Group order does not decide where a
      # dependency goes: Dependabot counts a group-by group as more specific,
      # and the first run with eslint-major listed above this one still split
      # @eslint/js and eslint-plugin-vue out into their own pull requests.
      npm-major:
        update-types: [major]
        group-by: dependency-name
        exclude-patterns: ["eslint", "@eslint/*", "eslint-plugin-*"]

  - package-ecosystem: github-actions
    # "/" is .github/workflows. Each composite action is its own directory.
    # Listing /acceptance also covers acceptance/broker-workflow.yml, the
    # template every broker runs: the first action update (pull request #8)
    # moved its checkout pin with the hub's. The test fails an update that
    # leaves it behind all the same.
    directories:
      - "/"
      - "/acceptance"
      - "/collect"
      - "/lockdown"
      - "/notify"
      - "/pages"
      - "/preserve"
      - "/provisioning"
      - "/registry"
      - "/report"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    # Every action update, majors included, in one pull request: the hub's
    # checkouts and App-token steps must agree on a single pinned SHA
    # (tests/workflow-hardening.test.mjs), and a per-directory split would
    # break that between merges.
    groups:
      actions:
        patterns: ["*"]
