name: PXL Classroom Accept
description: >-
  Validate a repository_dispatch acceptance event from a broker, match against
  the roster (or open-accept in v1), check guardrails, and record the
  acceptance. Designed to run in the per-org PRIVATE control repository.

inputs:
  client-id:
    description: GitHub App Client ID (provisioning App)
    required: true
  app-private-key:
    description: GitHub App private key (PEM)
    required: true
  org:
    description: Target organization
    required: true
  control-repo:
    description: Control repository name (this repo)
    required: true
  data-dir:
    description: Root of the control-repo data tree
    required: false
    default: "."
  assignment-id:
    description: Assignment ID. Defaults to repository_dispatch client_payload.
    required: false
    default: ${{ github.event.client_payload.assignment_id }}
  github-login:
    description: Student GitHub login. Defaults to repository_dispatch client_payload.
    required: false
    default: ${{ github.event.client_payload.github_login }}
  github-id:
    description: Student GitHub numeric ID. Defaults to repository_dispatch client_payload.
    required: false
    default: ${{ github.event.client_payload.github_id }}
  workflow-run-url:
    description: URL of the calling workflow run. Defaults to repository_dispatch client_payload.
    required: false
    default: ${{ github.event.client_payload.workflow_run_url }}
  bypass-window:
    description: Bypass assignment time windows (opens_at and deadline_at checks)
    required: false
    default: 'false'
  team-slug:
    description: >-
      Validated team slug for group assignments. No client_payload fallback:
      the dispatch payload is attacker-reachable, so the caller must pass a
      value it has validated itself (scripts/read-team-payload.mjs).
    required: false
    default: ''
  team-name:
    description: Validated team display name for group assignments.
    required: false
    default: ''
  team-action:
    description: Validated team action (join, create, switch).
    required: false
    default: ''
  team-code-payload:
    description: >-
      The team's join code, sealed to the hub's claim key, from the acceptance
      issue body (lib/team-join-code.mjs). Ciphertext only, bound to the
      student, the assignment and the team. Read only under
      group_config.require_join_code.
    required: false
    default: ''
  kind:
    description: >-
      What the student's signed title asked for - "accept" (a repository) or
      "confirm" (bind this account to an institutional address, and nothing
      else). Verified on the broker against a signature that covers it, never
      re-read from the title. EMPTY MEANS ACCEPT, and must: every dispatch made
      before confirmation existed carries no kind, and a broker published before
      it never sends one.
    required: false
    default: ''
  claim-payload:
    description: >-
      Sealed claim from the acceptance issue body, validated by
      scripts/read-team-payload.mjs. Ciphertext only - it rides on a public
      issue by design, so it is not secret. Read only under roster_mode: claim.
    required: false
    default: ''
  claim-verified:
    description: >-
      "true" when the student picked an address GitHub had already verified on
      their account, as asserted by the browser. Evidence, not a control: the
      hub cannot check it, and anyone writing the issue by hand can assert it.
    required: false
    default: ''
  claim-private-key:
    description: >-
      ECDH P-256 private key that opens a sealed claim. The hub ENVIRONMENT
      secret PXL_CLAIM_PRIVATE_KEY (provisioning, main only) - see INSTALL.md §3.2. Required only by roster_mode: claim, which fails closed with a
      red run rather than rejecting students when it is absent.
    required: false
    default: ''
  claim-private-keys-retired:
    description: >-
      Claim private keys being phased out, newline- or comma-separated. Tried
      after the current one. This is what makes ROTATION possible: the kid never
      travels with the ciphertext, so without it a new keypair would fail every
      claim already sealed to the old one - including acceptances already posted
      and every browser still running a cached bundle - and a decrypt failure
      sits after the attempt counter, so it would spend real students' attempts
      too. Drop a key from here once no cached bundle can still be sealing to
      it. See INSTALL.md §3.2.
    required: false
    default: ''
  prior-acceptance-file:
    description: >-
      Path to a copy of the acceptance record a retry sets aside so the gates
      run again. Read for its `accepted_at` and `issue_number` alone, so a
      retried student keeps the time they originally accepted. Empty for an
      ordinary acceptance.
    required: false
    default: ''
  set-aside:
    description: >-
      "true" on a lecturer's Retry: the student's acceptance record is removed
      from the checkout before every decision (acceptance/reserve.mjs), and is
      only ever replaced by an admitted one.
    required: false
    default: 'false'
  persist-refusals:
    description: >-
      "false" on a lecturer's Retry. An ordinary acceptance saves the claim
      attempt counter a refusal writes; a Retry never counted against the
      student.
    required: false
    default: 'true'
  issue-number:
    description: >-
      The broker issue this attempt is, as the hub read it back. Issue numbers
      only grow, so it orders a student's attempts: an older one GitHub starts
      late is `superseded` and does nothing. Empty on a Retry.
    required: false
    default: ''
  acted-at:
    description: >-
      GitHub's own created_at on the student's issue, as the hub read it back
      (scripts/read-team-payload.mjs) - never a dispatch value. A request made
      before the deadline is still in time when GitHub starts the run late
      (lib/acceptance-reservation.mjs actedInTime). Empty on a Retry.
    required: false
    default: ''

outputs:
  assignment_id:
    description: Validated assignment ID
    value: ${{ steps.accept.outputs.assignment_id }}
  github_login:
    description: Validated student GitHub login
    value: ${{ steps.accept.outputs.github_login }}
  github_id:
    description: Immutable GitHub user ID
    value: ${{ steps.accept.outputs.github_id }}
  outcome:
    description: >-
      accepted | already-accepted | confirmed | already-confirmed | superseded |
      rejected:* | fail:*. The two confirm outcomes come from kind: confirm and
      provision nothing - the provisioning step gates on `accepted` explicitly
      rather than on "not a rejection", which is why adding them here is safe.
      `superseded` is an older attempt overtaken by a newer one and does
      nothing at all. By the time this is set the decision is SAVED in the
      control repository (acceptance/reserve.mjs); `fail:reserve` means it could
      not be.
    value: ${{ steps.accept.outputs.outcome }}
  reject_reason:
    description: >-
      Human-readable reason for a rejected:* outcome, so the lecturer's
      notification says what the student actually ran into. Empty otherwise.
    value: ${{ steps.accept.outputs.reject_reason }}
  target_repo:
    description: Deterministic target repository name
    value: ${{ steps.accept.outputs.target_repo }}
  team_slug:
    description: Team slug if group assignment
    value: ${{ steps.accept.outputs.team_slug }}
  team_name:
    description: Team name if group assignment
    value: ${{ steps.accept.outputs.team_name }}
  is_first_member:
    description: Whether this is the first member of the team
    value: ${{ steps.accept.outputs.is_first_member }}
  previous_repo:
    description: Previous team repository name if switching teams
    value: ${{ steps.accept.outputs.previous_repo }}
  own_earlier_attempt:
    description: >-
      "true" when a repository at the student's name is this assignment's own
      earlier work (a prior acceptance that did not reuse an existing
      repository, or the team's own repository), so provisioning may remove it
      if it is empty. "false" on a first acceptance: that repository is kept.
    value: ${{ steps.accept.outputs.own_earlier_attempt }}
  template_owner:
    description: Template repository owner (from the assignment definition)
    value: ${{ steps.accept.outputs.template_owner }}
  template_repo:
    description: Template repository name (from the assignment definition)
    value: ${{ steps.accept.outputs.template_repo }}
  template_repository_id:
    description: Pinned template repository id, or empty when the assignment has no pin
    value: ${{ steps.accept.outputs.template_repository_id }}
  feedback_pr:
    description: Whether to set up a frozen baseline branch for a Feedback PR
    value: ${{ steps.accept.outputs.feedback_pr }}
  feedback_pr_baseline_branch:
    description: Baseline branch name for the Feedback PR
    value: ${{ steps.accept.outputs.feedback_pr_baseline_branch }}
  student_permission:
    description: The permission the assignment grants its students (pull | triage | push | maintain | admin)
    value: ${{ steps.accept.outputs.student_permission }}

runs:
  using: composite
  steps:
    # `client-id` and `app-private-key` were declared required by this action
    # from the day it was written and read by nothing in it - accept.mjs worked
    # entirely off the control repository checkout. Step 7 asks the
    # organization whether the target repository name is already taken, which is
    # the one question that cannot be answered from files, so the credentials
    # this action already demands are now actually used. Same mint, same pin and
    # same scope as provisioning/action.yml: an installation token for the
    # target org, and nothing wider.
    - name: Mint App installation token for the target org
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.org }}
        # Reads only: the student repository and its rulesets, both Metadata
        # (lib/app-token-scopes.mjs). Every repository, because it usually does
        # not exist yet.
        permission-metadata: read

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"

    - name: Install shared dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: npm ci --omit=dev

    # Decides AND SAVES: acceptance/reserve.mjs runs accept.mjs, commits what it
    # decided and pushes it, deciding again whenever another run saved one of
    # its inputs first. This is what keeps a team at its size now that nothing
    # serialises acceptances (lib/acceptance-reservation.mjs).
    - name: Decide acceptance and save the decision
      id: accept
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        ASSIGNMENT_ID: ${{ inputs.assignment-id }}
        GITHUB_LOGIN: ${{ inputs.github-login }}
        GITHUB_ID: ${{ inputs.github-id }}
        WORKFLOW_RUN_URL: ${{ inputs.workflow-run-url }}
        ORG: ${{ inputs.org }}
        CONTROL_REPO: ${{ inputs.control-repo }}
        DATA_DIR: ${{ inputs.data-dir }}
        BYPASS_WINDOW: ${{ inputs.bypass-window }}
        TEAM_SLUG: ${{ inputs.team-slug }}
        TEAM_NAME: ${{ inputs.team-name }}
        TEAM_ACTION: ${{ inputs.team-action }}
        TEAM_CODE_PAYLOAD: ${{ inputs.team-code-payload }}
        KIND: ${{ inputs.kind }}
        CLAIM_PAYLOAD: ${{ inputs.claim-payload }}
        CLAIM_VERIFIED: ${{ inputs.claim-verified }}
        CLAIM_PRIVATE_KEY: ${{ inputs.claim-private-key }}
        CLAIM_PRIVATE_KEYS_RETIRED: ${{ inputs.claim-private-keys-retired }}
        PRIOR_ACCEPTANCE_FILE: ${{ inputs.prior-acceptance-file }}
        SET_ASIDE: ${{ inputs.set-aside }}
        PERSIST_REFUSALS: ${{ inputs.persist-refusals }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        ACTED_AT: ${{ inputs.acted-at }}
      run: node "$GITHUB_ACTION_PATH/reserve.mjs"
