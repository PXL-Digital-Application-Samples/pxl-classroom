# PXL Classroom - broker watch:started handler.
#
# SECURITY MODEL:
# This workflow lives on a PUBLIC broker repo's default branch (one per assignment).
# When a student stars the broker, GitHub fires watch:started. This workflow validates
# the actor and dispatches a repository_dispatch event to the CENTRAL pxl-classroom repo.
#
# To do this, it mints an installation token for the PXL Classroom Provisioner App.
# The App installation is scoped explicitly to the PXL-Digital-Application-Samples org
# and the pxl-classroom repository ONLY. Therefore, a compromised broker workflow can
# only dispatch events to pxl-classroom.
#
# NO ATTACKER-CONTROLLED TEXT MAY REACH A SHELL HERE. The App private key is a repo
# secret on this public repository, and any GitHub account can open an issue on it.
# An issue body interpolated into `run:` was arbitrary code execution against that
# key. Every value below is passed through `env:` - never `${{ }}` inside a script -
# and the only event data forwarded is the issue NUMBER. The hub reads the body
# itself (scripts/read-team-payload.mjs) where it can validate it safely.
#
# Secrets required:
#   PXL_APP_CLIENT_ID      - Provisioning App Client ID (Iv… string)
#   PXL_APP_PRIVATE_KEY    - Provisioning App private key (PEM)
#
# Variables required:
#   ASSIGNMENT_ID          - set when publish-assignment creates this repo
#   CONTROL_ORG            - e.g. "PXLAutomation" (the org owning the control repo)

name: Acceptance trigger

on:
  watch:
    types: [started]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: accept-${{ github.actor }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: (github.event_name == 'watch' && github.event.action == 'started') || (github.event_name == 'issues' && github.event.action == 'opened')
    steps:
      - name: Validate actor
        id: validate
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.event.sender.id }}
        run: |
          [[ -n "$ACTOR" && -n "$ACTOR_ID" ]] \
            || { echo "::error::Missing actor"; exit 1; }
          # Charset-pin both before they leave this job. GitHub sets them, but a
          # value that reached a later shell unvalidated is how this file broke once.
          [[ "$ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]] \
            || { echo "::error::Actor is not a valid GitHub login"; exit 1; }
          [[ "$ACTOR_ID" =~ ^[0-9]+$ ]] \
            || { echo "::error::Actor id is not numeric"; exit 1; }
          {
            echo "actor=$ACTOR"
            echo "actor_id=$ACTOR_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve issue number and concurrency hint
        id: issue
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # Read through env, never interpolated into this script. A bash regex
          # match against an env var cannot break out of the script the way a
          # substituted `${{ }}` value can.
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          NUMBER=""
          HINT=""
          if [ "$EVENT_NAME" = "issues" ] && [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            NUMBER="$ISSUE_NUMBER"
            # Concurrency hint ONLY. The hub re-reads the issue and derives the
            # authoritative team from it; this exists so the hub's concurrency
            # group can serialize joins to one team, which is what guards team
            # capacity without a distributed lock (ARCHITECTURE §5.8).
            if [[ "$ISSUE_TITLE" =~ ^team:([a-z0-9][a-z0-9-]{0,63})$ ]]; then
              HINT="${BASH_REMATCH[1]}"
            fi
          fi
          {
            echo "number=$NUMBER"
            echo "team_hint=$HINT"
          } >> "$GITHUB_OUTPUT"

      - name: Mint dispatcher token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PXL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PXL_APP_PRIVATE_KEY }}
          owner: PXL-Digital-Application-Samples
          repositories: pxl-classroom

      - name: Dispatch to central pxl-classroom
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CONTROL_ORG: ${{ vars.CONTROL_ORG }}
          ASSIGNMENT_ID: ${{ vars.ASSIGNMENT_ID }}
          ACTOR: ${{ steps.validate.outputs.actor }}
          ACTOR_ID: ${{ steps.validate.outputs.actor_id }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          TEAM_HINT: ${{ steps.issue.outputs.team_hint }}
          BROKER_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ARGS=(
            "/repos/PXL-Digital-Application-Samples/pxl-classroom/dispatches"
            -f "event_type=acceptance"
            -f "client_payload[org]=$CONTROL_ORG"
            -f "client_payload[assignment_id]=$ASSIGNMENT_ID"
            -f "client_payload[github_login]=$ACTOR"
            -f "client_payload[github_id]=$ACTOR_ID"
            -f "client_payload[broker_repo]=$BROKER_REPO"
            -f "client_payload[workflow_run_url]=$RUN_URL"
          )
          if [ -n "$ISSUE_NUMBER" ]; then
            ARGS+=(-f "client_payload[issue_number]=$ISSUE_NUMBER")
          fi
          if [ -n "$TEAM_HINT" ]; then
            ARGS+=(-f "client_payload[team_hint]=$TEAM_HINT")
          fi
          gh api --method POST "${ARGS[@]}"

      - name: Clean up trigger issue
        if: always() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh has no git remote to infer the repo from.
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          [ -n "$ISSUE_NUMBER" ] || exit 0
          gh issue close "$ISSUE_NUMBER" --reason "completed" || true
          gh issue lock "$ISSUE_NUMBER" --reason "resolved" || true
